services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: uri
      POSTGRES_PASSWORD: uri_dev_local
      POSTGRES_DB: uri
    ports:
      - "127.0.0.1:55440:5432"
    volumes:
      - uri-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uri -d uri"]
      interval: 5s
      timeout: 5s
      retries: 12
  test-db:
    image: pgvector/pgvector:pg16
    profiles: ["test"]
    environment:
      POSTGRES_USER: uri
      POSTGRES_PASSWORD: uri_test_local
      POSTGRES_DB: uri_test
    ports:
      - "127.0.0.1:55441:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uri -d uri_test"]
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  uri-postgres-data:
