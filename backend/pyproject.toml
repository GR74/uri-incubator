[project]
name = "uri-backend"
version = "0.1.0"
description = "Local research backend for the Undergraduate Research Incubator"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13,<2.0",
  "anyio>=3.6.2,<4.10",
  "fastapi>=0.115,<0.116",
  "greenlet>=3,<4",
  "nbformat>=5.10,<6",
  "pydantic-settings>=2.0,<3.0",
  "pypdf>=5,<6",
  "python-multipart>=0.0.9,<1.0",
  "PyYAML>=6,<7",
  "python-docx>=1.1,<2",
  "psycopg[binary]>=3.2,<4.0",
  "sqlalchemy>=2.0,<3.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
uri-api = "uri_backend.api:main"
uri-worker = "uri_backend.ingestion.worker:main"

[dependency-groups]
dev = [
  "httpx>=0.27,<1.0",
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1.0",
  "ruff>=0.6,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
