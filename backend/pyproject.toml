[project]
name = "uri-backend"
version = "0.1.0"
description = "Local research backend for the Undergraduate Research Incubator"
requires-python = ">=3.11"
dependencies = [
  "anyio>=3.6.2,<4.10",
  "fastapi>=0.115,<0.116",
  "pydantic-settings>=2.0,<3.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "httpx>=0.27,<1.0",
  "pytest>=8,<9",
  "ruff>=0.6,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
