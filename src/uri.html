const TODAY = new Date('2026-08-24T12:00:00');
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

function d(iso){ return new Date(iso + 'T12:00:00'); }
function fmt(iso){ const x = d(iso); return x.getDate() + ' ' + MONTHS[x.getMonth()] + ' ' + x.getFullYear(); }
function fmtShort(iso){ const x = d(iso); return MONTHS[x.getMonth()] + ' ’' + String(x.getFullYear()).slice(2); }
function daysAgo(iso){ return Math.round((TODAY - d(iso)) / 86400000); }
function daysUntil(iso){ return -daysAgo(iso); }
function ago(iso){
  const n = daysAgo(iso);
  if (n < 1) return 'today';
  if (n < 2) return 'yesterday';
  if (n < 45) return n + ' days ago';
  const m = Math.round(n / 30.4);
  if (m < 22) return m + ' months ago';
  return (n / 365).toFixed(1) + ' years ago';
}
function spanMonths(iso){ return Math.max(1, Math.round(daysAgo(iso) / 30.4)); }
function sortedLog(p){ return [...p.log].sort((a,b) => d(b.d) - d(a.d)); }
function counts(p){ const c = {}; TYPE_ORDER.forEach(t => c[t] = 0); p.log.forEach(e => c[e.t]++); return c; }
function pl(n, one, many){ return n + ' ' + (n === 1 ? one : many); }
function lastTouch(p){ return Math.min(...p.log.map(e => daysAgo(e.d))); }

/* ── people lookups ── */
const byKey  = k => PEOPLE.find(x => x.k === k);
const byShort = s => PEOPLE.find(x => x.s === s.trim());
function authorsOf(e){ return e.au.split('/').map(s => byShort(s)).filter(Boolean); }
function onProject(pid, tier){ return PEOPLE.filter(x => (x.projects||[]).includes(pid) && (!tier || x.tier === tier)); }
function mentorOf(pid){ return onProject(pid, 'phd')[0] || null; }
function scopeOf(me){

}

/* PROCEDURAL knowledge — the stuff that is method, not result. Results survive in
   papers; procedures survive only in people, which is the whole problem. */
const PROCEDURAL = ['method','decision','deadend','blocker'];

/* An entry is single-source if exactly one person wrote it and nobody else has
   written anything on the same subject. We approximate "subject" with type. */
function singleSource(p){
  const out = { live:[], orphaned:[] };
  p.log.forEach(e => {
    if (!PROCEDURAL.includes(e.t)) return;
    const au = authorsOf(e);
    if (au.length !== 1) return;
    const who = au[0];
    if (who.tier === 'alum') out.orphaned.push({ e, who });
    else if (who.tier === 'ug' || who.tier === 'phd') out.live.push({ e, who });
  });
  return out;
}
function soleAuthoredBy(p, personKey){
  return p.log.filter(e => {
    const au = authorsOf(e);
    return PROCEDURAL.includes(e.t) && au.length === 1 && au[0].k === personKey;
  });
}

/* Continuity index — a survivability estimate, not a quality score. */
function continuity(p){
  const c = counts(p);
  const volume   = Math.min(1, p.log.length / 12) * 30;
  const coverage = (TYPE_ORDER.filter(t => c[t] > 0).length / 6) * 25;
  const last     = lastTouch(p);
  const fresh    = p.status === 'archived' ? 20 : Math.max(0, 1 - last / 120) * 20;
  const failures = Math.min(1, c.deadend / 3) * 15;
  const runway   = Math.min(1, c.next / 3) * 10;
  return {
    score: Math.round(volume + coverage + fresh + failures + runway), lastDays: last,
    parts: [
      { k:'Log volume',        v:volume,   max:30 },
      { k:'Entry-type spread', v:coverage, max:25 },
      { k:'Recency',           v:fresh,    max:20 },
      { k:'Failures recorded', v:failures, max:15 },
      { k:'Open runway',       v:runway,   max:10 },
    ],
  };
}
function grade(s){ return s >= 80 ? 'Strong' : s >= 60 ? 'Adequate' : s >= 40 ? 'Thin' : 'At risk'; }

/* ── CONTINUITY DEBT ────────────────────────────────────────────────────────
   One engine, two readings. Faculty and PhD mentors see a risk register.
   The undergraduate whose name is attached sees the same rows as a to-do list.
   Nothing is computed twice, which is the point of the whole product. */
function debts(p){
  const out = [];
  const c = counts(p);
  const ss = singleSource(p);
  const last = lastTouch(p);
  const stale = p.log.filter(e => e.t === 'next' && daysAgo(e.d) > 60);
  const leaving = onProject(p.id, 'ug').filter(x => x.state === 'outgoing')[0];
  const arriving = onProject(p.id, 'ug').filter(x => x.state === 'incoming')[0];
  const staffed = onProject(p.id, 'ug').filter(x => x.state === 'active' || x.state === 'outgoing');
  const add = o => out.push(o);

  if (p.status !== 'archived' && last > 45)
    add({ sev:2, k:'stale', owner:staffed[0]?.k, h:'Log has been quiet for ' + last + ' days',
          faculty:'Nothing has been written down since ' + fmt(sortedLog(p)[0].d) + '. Work is almost certainly still happening.',
          student:'Your last entry was ' + last + ' days ago. Even one line about what you tried this month keeps this from becoming a gap.' });

  if (stale.length)
    add({ sev:1, k:'stale-next', owner:staffed[0]?.k, h:pl(stale.length,'next step','next steps') + ' open longer than 60 days',
          faculty:'Either these are stalled, or they are done and nobody closed them. Both are worth a question.',
          student:'These have been sitting a while — close them, or add a line saying what is blocking them.' });

  if (ss.orphaned.length)
    add({ sev:3, k:'orphan', h:pl(ss.orphaned.length,'procedure','procedures') + ' whose only author has already left',
          faculty:'Written by ' + [...new Set(ss.orphaned.map(x => x.who.n))].join(', ') + '. If the writing is thin, nobody alive can thicken it.',
          student:'These were written by students who have graduated. If you have run any of them, add what the notes leave out.' });

  if (ss.live.length)
    add({ sev:2, k:'sole', owner:ss.live[0].who.k, h:pl(ss.live.length,'procedure','procedures') + ' with exactly one living witness',
          hs:'You are the only written source for ' + pl(ss.live.length,'procedure','procedures'),
          faculty:'One person on this project is the only written source for these. That is a single point of failure with a graduation date.',
          student:'You are the only person who has written any of these down. That is flattering and dangerous.' });

  if (leaving && arriving)
    add({ sev:3, k:'handoff', owner:leaving.k, h:leaving.n + ' departs in ' + daysUntil(leaving.departs) + ' days',
          hs:'You leave in ' + daysUntil(leaving.departs) + ' days',
          faculty:arriving.n + ' arrives ' + fmt(arriving.starts) + '. The overlap is ' + Math.round((d(leaving.departs) - d(arriving.starts))/86400000) + ' days — that window is the only chance for anything unwritten to transfer in person.',
          student:'You overlap with ' + arriving.n + ' for ' + Math.round((d(leaving.departs) - d(arriving.starts))/86400000) + ' days. After that, only what you wrote down goes with the project.' });

  if (leaving && !arriving)
    add({ sev:3, k:'nosucc', owner:leaving.k, h:'No successor assigned', hs:'Nobody is queued to take this over',
          faculty:leaving.n + ' leaves in ' + daysUntil(leaving.departs) + ' days and nobody is queued behind them.',
          student:'No one is queued to take this over yet.' });

  if (p.status !== 'archived' && staffed.length === 0)
    add({ sev:3, k:'unstaffed', h:'No undergraduate assigned',
          faculty:'The project is running on the log alone. Every week here widens the gap.',
          student:'' });

  if (c.deadend === 0 && p.log.length > 4)
    add({ sev:1, k:'nofail', owner:staffed[0]?.k, h:'No dead ends recorded',
          faculty:'Either nothing has failed here, or failures are not reaching the log. The second is far more likely.',
          student:'Nothing failed? Write down one thing that did not work. It is the most useful entry you will ever file.' });

  const pending = p.log.filter(e => e.ack === false);
  if (pending.length)
    add({ sev:2, k:'ack', h:pl(pending.length,'entry','entries') + ' awaiting sign-off',
          faculty:'Decisions and dead ends need a second reader before they harden into lab practice.',
          student:'Filed and waiting on your PI to sign off.' });

  return out.sort((a,b) => b.sev - a.sev);
}

const GLOW = {

  warm:  'radial-gradient(125% 115% at 8% -12%, rgba(187,0,0,.20), transparent 56%), radial-gradient(95% 95% at 100% 112%, rgba(150,114,12,.26), transparent 62%)',
  blood: 'radial-gradient(130% 120% at 14% -14%, rgba(187,0,0,.52), transparent 58%), radial-gradient(95% 95% at 98% 112%, rgba(111,109,105,.22), transparent 62%)',
};
function Plate({ tone='ink', eyebrow, title, lede, figures, ghost, children, variant }){
  if (variant === 'rule') return (
    <section className="mt-10 rise">
      <div className="font-mono text-[10px] uppercase tracking-mega text-faint">{eyebrow}</div>
      <h1 className="font-display text-[38px] md:text-[50px] leading-[1.05] font-light mt-4 max-w-[20ch]">{title}</h1>
      {lede && <p className="text-[14px] leading-relaxed text-muted mt-5 measure">{lede}</p>}
      {figures && (
        <div className="grid grid-cols-2 md:grid-cols-4 gap-y-6 mt-9 pt-7 dbl">
          {figures.map((f,i) => (
            <div key={f[1]} className="rise" style={{ animationDelay:(100+i*70)+'ms' }}>
              <div className="font-display text-[34px] leading-none font-light tnum">{f[0]}</div>
              <div className="font-mono text-[9.5px] uppercase tracking-wider2 text-muted mt-2">{f[1]}</div>

    <section className="plate crop rounded-[4px] px-8 md:px-12 py-11 mt-8 rise"
             style={{ background: tone==='warm' ? '#2B2A28' : tone==='blood' ? '#380A0A' : '#191817', color:'#EDECE8' }}>
      <div className="absolute inset-0 pointer-events-none" style={{ background:GLOW[tone], zIndex:1 }} />
      {ghost && <span className="ghostnum tnum">{ghost}</span>}
      <div className="max-w-[62ch]">
        <div className="font-mono text-[10px] uppercase tracking-mega" style={{ color:'rgba(237,236,232,.55)' }}>{eyebrow}</div>
        <h1 className="font-display text-[40px] md:text-[52px] leading-[1.06] font-light mt-4 wipe">{title}</h1>
        {lede && <p className="text-[14px] leading-relaxed mt-5" style={{ color:'rgba(237,236,232,.72)' }}>{lede}</p>}
      </div>
      {figures && (
        <div className="grid grid-cols-2 md:grid-cols-4 gap-y-7 mt-11 pt-8 dbl-light">
          {figures.map((f,i) => (
            <div key={f[1]} className="rise" style={{ animationDelay:(120+i*80)+'ms' }}>
              <div className="font-display text-[40px] leading-none font-light tnum">{f[0]}</div>

              {f[2] && <div className="font-display italic text-[13px] mt-0.5" style={{ color:'rgba(237,236,232,.45)' }}>{f[2]}</div>}
            </div>
          ))}
        </div>
      )}
      {children}
    </section>
  );
}

function PageIntro({ what, children }){

    <div className="mt-12 mb-7 flex items-start gap-4">

}

/* ────────────────────────────────────────────────────────────────────────────
   SHARED REGISTER — one list, two readings

function Register({ projects, me, open, goOnboard }){
  const [filter, setFilter] = useState('all');

  const shown = projects.filter(p => filter === 'all' || p.status === filter);
  return (
    <>
      <div className="flex items-end justify-between gap-4 flex-wrap mb-4">
        <h2 className="font-display text-[26px]">{sup ? 'Project register' : 'Projects you can see'}</h2>
        <div className="flex items-center gap-1">
          {[['all','All'],['active','Active'],['handoff','Handoff'],['archived','Archived']].map(([k,l]) => (
            <button key={k} onClick={() => setFilter(k)}
              className={'font-mono text-[10px] uppercase tracking-wider2 px-2.5 py-1 rounded-[2px] transition-colors ' +
                (filter===k ? 'bg-ink text-paper' : 'text-faint hover:text-ink2 hover:bg-rule/40')}>{l}</button>
          ))}
        </div>
      </div>
      <div className="dbl">
        {shown.map((p,i) => <ProjectRow key={p.id} p={p} i={i} me={me} onOpen={() => open(p.id)} goOnboard={goOnboard} />)}

  const sup = me.tier !== 'ug';

  const myNext = p.log.filter(e => e.t==='next');

  return (
    <article onClick={onOpen}
      className="group cursor-pointer border-b hair py-8 grid grid-cols-12 gap-6 rise transition-colors hover:bg-card/70 px-3 -mx-3"

      <div className="col-span-12 lg:col-span-7">
        <div className="flex items-center gap-2.5 flex-wrap">

          <Pill status={p.status} />
          <span className="font-mono text-[10px] uppercase tracking-wider2 text-faint">{p.field}</span>
          {mine && <span className="font-mono text-[9.5px] uppercase tracking-wider2 px-1.5 py-[2px] rounded-[2px] bg-ink text-paper">Yours</span>}

        <h3 className={'font-display text-[28px] leading-[1.15] mt-3 max-w-[24ch] ' + (p.status==='archived' ? 'text-ink2' : '')}>

        <p className="text-[13.5px] leading-relaxed text-muted mt-3 measure">{p.oneLine}</p>

        <div className="flex items-center gap-x-6 gap-y-3 mt-5 flex-wrap">
          <span className="flex items-center gap-2"><Kicker>PI</Kicker><span className="text-[13px]">{p.pi}</span></span>
          {mentor && <span className="flex items-center gap-1.5"><PersonLink p={mentor} dim /><span className="font-mono text-[9.5px] uppercase tracking-wider2 text-faint">PhD mentor</span></span>}
          {p.current.map(st => { const per = PEOPLE.find(x => x.n === st.n);
            return per ? <PersonLink key={st.n} p={per} /> : (
              <span key={st.n} className="flex items-center gap-2"><Avatar initials={st.i} /><span className="text-[13px]">{st.n}</span></span>); })}
          {p.incoming && <span className="flex items-center gap-2"><Avatar initials={p.incoming.i} dim /><span className="text-[13px]" style={{color:'#96720C'}}>{p.incoming.n} <span className="text-faint">incoming</span></span></span>}
          {p.current.length===0 && !p.incoming && <span className="font-display italic text-[13px] text-faint">No undergraduate assigned</span>}
        </div>
      </div>

      <div className="col-span-12 lg:col-span-5 lg:pl-8 lg:border-l hair flex flex-col justify-between gap-5">
        <div>
          <div className="flex items-start justify-between gap-4">
            <div>
              <Kicker>Continuity index</Kicker>
              <div className="flex items-baseline gap-2 mt-1.5">
                <span className="font-display text-[36px] leading-none font-light tnum">{ci.score}</span>
                <span className="font-display italic text-[14px] text-muted">{grade(ci.score)}</span>
              </div>
            </div>
            <Meter ci={ci} />
          </div>
          <div className="flex items-center gap-3 mt-4 flex-wrap">
            {TYPE_ORDER.filter(t => c[t] > 0).map(t => (
              <span key={t} className="flex items-center gap-1.5 font-mono text-[10px] text-muted" title={TYPES[t].label}>
                <Mark t={t} size={14} /> {c[t]}
              </span>
            ))}

        {sup ? (
          <div className="border-t hair pt-3">
            <Kicker className="mb-2">Continuity debt · {dd.length} open</Kicker>
            <div className="space-y-1.5">
              {dd.slice(0,3).map(x => (
                <div key={x.k} className="flex items-start gap-2">
                  <SevDot sev={x.sev} />
                  <span className="text-[12.5px] leading-snug text-ink2">{x.h}</span>
                </div>
              ))}
              {dd.length === 0 && <span className="font-display italic text-[13px] text-muted">Nothing outstanding.</span>}

          </div>
        ) : (
          <div className="border-t hair pt-3">
            <Kicker className="mb-1.5">{mine ? myNext.length + ' open next steps · last entry ' + ago(latest.d) : 'Last entry · ' + ago(latest.d)}</Kicker>
            <div className="flex gap-2.5 items-start">
              <Mark t={latest.t} size={16} />
              <p className="text-[13px] leading-snug text-ink2 line-clamp-2">{latest.h}</p>

}

/* ────────────────────────────────────────────────────────────────────────────
   FACULTY / PhD — REGISTER
   ──────────────────────────────────────────────────────────────────────────── */
function SupRegister({ projects, me, open, goOnboard }){
  const ugs = PEOPLE.filter(x => x.tier==='ug' && x.state!=='incoming' && projects.some(p => (x.projects||[]).includes(p.id)));
  const leaving = PEOPLE.filter(x => (x.tier==='ug'||x.tier==='phd') && x.departs && daysUntil(x.departs) > 0 && daysUntil(x.departs) < 400
                                     && projects.some(p => (x.projects||[]).includes(p.id)))
                        .sort((a,b) => d(a.departs)-d(b.departs));
  const allDebt = projects.flatMap(p => debts(p).map(x => ({...x, p})));
  const crit = allDebt.filter(x => x.sev===3);
  const next = leaving[0];

  return (
    <div className="max-w-[1240px] mx-auto px-8 pb-32">
      <Plate
        tone="ink" ghost={projects.length}
        eyebrow={me.tier==='pi' ? 'Register · principal investigator' : 'Register · PhD mentor'}
        title={next
          ? projects.length + ' projects. The next one changes hands in ' + daysUntil(next.departs) + ' days.'
          : projects.length + ' projects, none of them changing hands this year.'}
        lede="This is what your group would lose if every undergraduate stopped answering email tomorrow. The index is not a grade — it estimates how much of each project survives its current student."
        figures={[
          [projects.length, projects.length === 1 ? 'project in scope' : 'projects in scope'],
          [ugs.length, ugs.length === 1 ? 'undergraduate' : 'undergraduates', ugs.length ? ugs.map(x=>x.i).join(' · ') : null],
          [crit.length, crit.length === 1 ? 'critical debt' : 'critical debts', crit.length ? 'need a decision' : 'clear'],
          [next ? daysUntil(next.departs) : '—', 'days to next departure', next ? next.n : null],
        ]}
      />
      <PageIntro what="Every project in your scope, ranked as written. What you see on the right is continuity debt — the specific, named ways this project is currently un-inheritable." />
      <Register projects={projects} me={me} open={open} goOnboard={goOnboard} />
    </div>
  );
}

/* ────────────────────────────────────────────────────────────────────────────
   FACULTY / PhD — CONTINUITY RISK
   ──────────────────────────────────────────────────────────────────────────── */
function RiskView({ projects, shelf, me, open, ack, nudge, nudged }){
  const rows = [...projects].map(p => ({ p, dd:debts(p), ci:continuity(p) }))
    .sort((a,b) => (b.dd.filter(x=>x.sev===3).length - a.dd.filter(x=>x.sev===3).length) || (a.ci.score - b.ci.score));
  const pending = projects.flatMap(p => p.log.filter(e => e.ack === false).map(e => ({ e, p })))
    .sort((a,b) => d(b.e.d) - d(a.e.d));

  /* single-source knowledge, by person — magnitude, so one hue, length-encoded */
  const witnesses = {};
  projects.forEach(p => {
    const ss = singleSource(p);
    [...ss.live, ...ss.orphaned].forEach(({ e, who }) => {
      witnesses[who.k] = witnesses[who.k] || { who, n:0, projects:new Set() };
      witnesses[who.k].n++; witnesses[who.k].projects.add(p.code);
    });
  });
  const wits = Object.values(witnesses).sort((a,b) => b.n - a.n);
  const wmax = Math.max(1, ...wits.map(w => w.n));

  return (
    <div className="max-w-[1240px] mx-auto px-8 pb-32">
      <Plate tone="blood" ghost={rows.reduce((a,r)=>a+r.dd.length,0)}
        eyebrow="Continuity risk"
        title="Procedures with only one documented source."
        lede="This view shows where important project knowledge depends on one person and may be lost when that person leaves."
        figures={[
          [rows.reduce((a,r)=>a+r.dd.length,0), 'open debts'],
          [rows.reduce((a,r)=>a+r.dd.filter(x=>x.sev===3).length,0), 'critical'],
          [wits.filter(w=>w.who.tier==='alum').reduce((a,w)=>a+w.n,0), 'procedures already orphaned', 'author has graduated'],
          [pending.length, pending.length === 1 ? 'awaiting your sign-off' : 'awaiting your sign-off'],
        ]}
      />

      <PageIntro what="Three readings of the same log: what each project owes, who is the sole written source for what, and what is waiting on your signature. A project can score well on continuity and still carry critical debt — the index measures how much was written down, the debt list measures how few people it rests on." />

      <Simulator projects={projects} shelf={shelf} me={me} />

      {/* risk register */}
      <div className="dbl mt-14">
        {rows.map(({ p, dd, ci }, i) => (
          <div key={p.id} className="border-b hair py-7 rise" style={{ animationDelay:(i*80)+'ms' }}>
            <div className="grid grid-cols-12 gap-6">
              <div className="col-span-12 md:col-span-4">
                <div className="flex items-center gap-2.5 flex-wrap"><Tag>{p.code}</Tag><Pill status={p.status} /></div>
                <button onClick={() => open(p.id)} className="group text-left block mt-2.5">
                  <h3 className="font-display text-[21px] leading-snug max-w-[20ch]"><span className="u-hover">{p.name}</span></h3>
                </button>
                <div className="flex items-baseline gap-2 mt-3">
                  <span className="font-display text-[26px] leading-none font-light tnum">{ci.score}</span>
                  <span className="font-display italic text-[13px] text-muted">{grade(ci.score)}</span>
                  <span className="ml-1"><Meter ci={ci} /></span>
                </div>
              </div>
              <div className="col-span-12 md:col-span-8 md:border-l hair md:pl-7 space-y-3">
                {dd.length === 0 && <p className="font-display italic text-muted">Nothing outstanding on this project.</p>}
                {dd.map(x => (
                  <div key={x.k} className="flex items-start gap-3">
                    <SevDot sev={x.sev} />
                    <div className="flex-1">
                      <div className="flex items-center gap-2 flex-wrap">
                        <span className="text-[14px] leading-snug">{x.h}</span>
                        <span className="font-mono text-[9px] uppercase tracking-wider2 px-1.5 py-[1px] rounded-[2px]"
                              style={{ color:SEV[x.sev].c, background:SEV[x.sev].c+'1A' }}>{SEV[x.sev].l}</span>
                      </div>
                      <p className="text-[12.5px] leading-relaxed text-muted mt-1 measure">{x.faculty}</p>
                    </div>
                    {x.owner && (
                      <button onClick={() => nudge(p.id + ':' + x.k)}
                        className={'shrink-0 font-mono text-[9.5px] uppercase tracking-wider2 px-2.5 py-1.5 rounded-[2px] border transition-colors ' +
                          (nudged.includes(p.id+':'+x.k) ? 'border-transparent text-faint' : 'hair hover:bg-ink hover:text-paper hover:border-ink')}>
                        {nudged.includes(p.id+':'+x.k) ? '✓ on their bench' : 'Send to ' + byKey(x.owner).n.split(' ')[0]}
                      </button>
                    )}
                  </div>
                ))}
              </div>
            </div>
          </div>
        ))}
      </div>

      {/* single-source knowledge */}
      <section className="mt-16">
        <h2 className="font-display text-[26px]">Single-source knowledge</h2>
        <p className="text-[13.5px] text-muted mt-2 measure">
          Procedural entries — methods, decisions, dead ends, blockers — with exactly one author.
          Longer bar, more of the lab that exists in one person’s handwriting.
        </p>
        <div className="flex items-center gap-5 mt-5 font-mono text-[10px] uppercase tracking-wider2 text-muted">
          <span className="flex items-center gap-2"><span className="w-4 h-[10px] rounded-[2px]" style={{background:'#1A1917'}} /> Still here</span>
          <span className="flex items-center gap-2"><span className="w-4 h-[10px] rounded-[2px] hatch-warn" style={{background:'rgba(187,0,0,.18)', outline:'1px solid #BB0000'}} /> Author has graduated</span>
        </div>
        <div className="mt-6 space-y-2.5">
          {wits.map((w,i) => {
            const gone = w.who.tier === 'alum';
            return (
              <div key={w.who.k} className="grid grid-cols-[190px_1fr_auto] items-center gap-4 rise" style={{ animationDelay:(i*60)+'ms' }}>
                <div className="flex items-center gap-2.5 min-w-0">
                  <PersonLink p={w.who} dim={gone} />
                  <span className="font-mono text-[9px] uppercase tracking-wider2 text-faint truncate">
                    {gone ? 'graduated ' + fmtShort(w.who.departs) : w.who.tier === 'phd' ? 'PhD' : 'undergrad'}
                  </span>
                </div>
                <div className="h-[18px] relative" title={w.n + ' single-source entries · ' + [...w.projects].join(', ')}>
                  <div className={'h-full rounded-r-[4px] bar ' + (gone ? 'hatch-warn' : '')}
                       style={{ width:(w.n/wmax*100)+'%', background: gone ? 'rgba(187,0,0,.16)' : '#1A1917',
                                outline: gone ? '1px solid #BB0000' : 'none', animationDelay:(i*60)+'ms' }} />
                </div>
                <span className="font-mono text-[12px] tnum text-ink2 w-6 text-right">{w.n}</span>
              </div>
            );
          })}
        </div>
      </section>

      {/* sign-off queue */}
      <section className="mt-16">
        <h2 className="font-display text-[26px]">Awaiting sign-off</h2>
        <p className="text-[13.5px] text-muted mt-2 measure">
          Decisions and dead ends need a second reader before they harden into lab practice. This is the only
          queue in the product, and it is deliberately short.
        </p>
        <div className="mt-6 space-y-3">
          {pending.length === 0 && (
            <p className="font-display italic text-[16px] text-muted py-8 border-t hair">
              Nothing waiting. File an entry from a student account and it will appear here.
            </p>
          )}
          {pending.map(({ e, p }) => (
            <div key={e.id} className="border hair rounded-[3px] bg-card px-5 py-4 flex items-start gap-4 rise"
                 style={{ borderLeft:'3px solid '+TYPES[e.t].color }}>
              <Mark t={e.t} size={18} />
              <div className="flex-1">
                <div className="flex items-center gap-2.5 flex-wrap">
                  <span className="font-mono text-[10px] uppercase tracking-wider2" style={{ color:TYPES[e.t].color }}>{TYPES[e.t].label}</span>

/* ────────────────────────────────────────────────────────────────────────────
   DEPARTURE TIMELINE — interval occupancy, 18 months
   Colour here is STATUS, not series identity: every bar is also directly
   labelled with the person's name, so nothing is carried by hue alone.
   ──────────────────────────────────────────────────────────────────────────── */
const WIN0 = '2026-02-01', WIN1 = '2027-09-01';
const WSPAN = d(WIN1) - d(WIN0);
const pctOf = iso => Math.max(0, Math.min(100, (d(iso) - d(WIN0)) / WSPAN * 100));
const clampISO = iso => d(iso) < d(WIN0) ? WIN0 : d(iso) > d(WIN1) ? WIN1 : iso;

function ticks(){
  const out = []; const x = d(WIN0);
  while (x < d(WIN1)) { out.push(new Date(x)); x.setMonth(x.getMonth() + 1); }
  return out;
}
function segmentsFor(p){
  const segs = [];
  PEOPLE.filter(x => (x.projects||[]).includes(p.id)).forEach(x => {
    if (x.tier === 'pi') return;
    const from = x.starts || x.joined || WIN0;
    const to   = x.departs || WIN1;
    if (d(to) <= d(WIN0) || d(from) >= d(WIN1)) return;
    segs.push({
      who:x, from:clampISO(from), to:clampISO(to),
      kind: x.tier === 'phd' ? 'mentor' : x.state === 'incoming' ? 'incoming' : x.tier === 'alum' ? 'past' : 'current',
    });
  });
  return segs;
}
/* An overlap is a DEPARTING student sharing time with an ARRIVING one — two
   co-workers on a project at the same time is just staffing, not a handoff. */
function handoffOverlap(p){
  const out = onProject(p.id,'ug').find(x => x.state === 'outgoing');
  const inc = onProject(p.id,'ug').find(x => x.state === 'incoming');
  if (!out || !inc || !out.departs || !inc.starts) return null;
  if (d(out.departs) <= d(inc.starts)) return null;
  return { from:inc.starts, to:out.departs, days:Math.round((d(out.departs) - d(inc.starts)) / 86400000) };
}
/* daily scan for stretches with nobody on the project */
function gaps(p){
  const segs = segmentsFor(p).filter(s => s.kind !== 'mentor');
  const out = []; let cur = null;
  for (let t = d(WIN0).getTime(); t <= d(WIN1).getTime(); t += 86400000){
    const covered = segs.some(s => d(s.from).getTime() <= t && d(s.to).getTime() >= t);
    const iso = new Date(t).toISOString().slice(0,10);
    if (!covered){ cur = cur || { from:iso }; cur.to = iso; }
    else if (cur){ out.push(cur); cur = null; }
  }
  if (cur) out.push(cur);
  return out;
}

const BARC = {
  current:  { bg:'#4A4844', fg:'#F2F1EE', label:'On the project' },
  incoming: { bg:'#96720C', fg:'#1A1917', label:'Arriving' },
  mentor:   { bg:'#41647C', fg:'#F2F1EE', label:'PhD mentor' },
  past:     { bg:'rgba(111,109,105,.16)', fg:'#6F6D69', label:'Already graduated' },
};

function Timeline({ projects }){
  const tk = ticks();
  return (
    <figure className="mt-8">
      <figcaption className="sr-only">Undergraduate staffing by project, February 2026 to September 2027</figcaption>

      {/* legend — identity is never colour-alone, but the legend is still here */}
      <div className="flex items-center gap-x-5 gap-y-2 flex-wrap font-mono text-[10px] uppercase tracking-wider2 text-muted mb-5">
        {['current','incoming','mentor','past'].map(k => (
          <span key={k} className="flex items-center gap-2">
            <span className="w-4 h-[10px] rounded-[2px]" style={{ background:BARC[k].bg, outline: k==='past' ? '1px solid #C2C0BA' : 'none' }} />
            {BARC[k].label}
          </span>
        ))}
        <span className="flex items-center gap-2"><span className="w-4 h-[10px] rounded-[2px] hatch-warn" style={{ outline:'1px solid #BB0000' }} /> Nobody assigned</span>
      </div>

      <div className="relative overflow-x-auto hidescroll">
        <div className="min-w-[720px]">
          {/* month axis */}
          <div className="relative h-6 border-b hair">
            {tk.map((x,i) => {
              const iso = x.toISOString().slice(0,10);
              const show = x.getMonth() % 3 === 0;
              return (
                <span key={i} className="absolute top-0 bottom-0" style={{ left:pctOf(iso)+'%' }}>
                  <span className="absolute bottom-0 w-px bg-rule" style={{ height: show ? '10px' : '5px' }} />
                  {show && <span className="absolute bottom-[13px] -translate-x-1/2 font-mono text-[9.5px] uppercase tracking-wider2 text-faint whitespace-nowrap">{fmtShort(iso)}</span>}
                </span>
              );
            })}
          </div>

          {/* lanes */}
          <div className="relative">
            {/* today */}
            <div className="absolute top-0 bottom-0 z-30 pointer-events-none" style={{ left:pctOf('2026-08-24')+'%' }}>
              <div className="w-px h-full" style={{ background:'#1A1917' }} />
              <span className="absolute -top-[1px] left-1.5 font-mono text-[9px] uppercase tracking-wider2 bg-paper px-1" style={{ color:'#1A1917' }}>Today</span>
            </div>

            {projects.map((p,i) => {
              const segs = segmentsFor(p);
              const gp = gaps(p);
              const ov = handoffOverlap(p);
              const dormant = p.status === 'archived';
              return (
                <div key={p.id} className="relative border-b hair py-4 rise" style={{ animationDelay:(i*110)+'ms' }}>
                  <div className="flex items-baseline gap-2.5 mb-2.5">
                    <Tag>{p.code}</Tag>
                    <span className="font-display text-[15px] leading-none truncate max-w-[46ch]">{p.name}</span>
                  </div>

                  <div className="relative h-[64px]">
                    {/* gaps first, behind everything */}
                    {gp.map((g,j) => (
                      <div key={'g'+j} className={'absolute top-0 bottom-0 rounded-[2px] ' + (dormant ? 'hatch' : 'hatch-warn')}
                           title={dormant ? 'Archived — no staffing expected' : 'No undergraduate assigned'}
                           style={{ left:pctOf(g.from)+'%', width:(pctOf(g.to)-pctOf(g.from))+'%',
                                    border:'1px dashed ' + (dormant ? 'rgba(111,109,105,.45)' : 'rgba(187,0,0,.5)') }}>
                        <span className="absolute inset-0 grid place-items-center font-mono text-[9.5px] uppercase tracking-wider2 whitespace-nowrap px-2"
                              style={{ color: dormant ? '#6F6D69' : '#BB0000' }}>
                          {dormant ? 'Archived — no staffing expected' : 'Nobody assigned'}
                        </span>
                      </div>
                    ))}
                    {/* overlap bracket */}
                    {ov && (
                      <div className="absolute -top-[2px] h-[3px] rounded-full z-20" title="Handoff overlap"
                           style={{ left:pctOf(ov.from)+'%', width:(pctOf(ov.to)-pctOf(ov.from))+'%', background:'#96720C' }}>
                        <span className="absolute left-1/2 -translate-x-1/2 -top-[15px] font-mono text-[9px] uppercase tracking-wider2 whitespace-nowrap" style={{ color:'#96720C' }}>
                          {ov.days}-day overlap
                        </span>
                      </div>
                    )}

                    {/* bars — mentor on its own row, undergrads stacked below */}
                    {segs.map((s,j) => {
                      const isMentor = s.kind === 'mentor';
                      const row = isMentor ? 0 : 1 + segs.filter(z => z.kind !== 'mentor').indexOf(s);
                      const C = BARC[s.kind];
                      return (
                        <div key={s.who.k}
                          className="absolute rounded-[3px] bar flex items-center px-2 overflow-hidden"
                          title={s.who.n + ' · ' + fmt(s.from) + ' → ' + (s.who.departs ? fmt(s.who.departs) : 'ongoing')}
                          style={{
                            left:pctOf(s.from)+'%', width:'calc(' + (pctOf(s.to)-pctOf(s.from)) + '% - 2px)',
                            top: row * 21, height: isMentor ? 15 : 17,
                            background:C.bg, color:C.fg, animationDelay:(i*110 + j*70)+'ms',
                            outline: s.kind==='past' ? '1px solid #C2C0BA' : 'none',
                            boxShadow: '0 0 0 2px #F2F1EE',
                          }}>
                          <span className="font-mono text-[9.5px] uppercase tracking-wide whitespace-nowrap truncate">
                            {isMentor ? '⌁ ' : ''}{s.who.n}
                          </span>
                        </div>
                      );
                    })}

                    {/* departure ticks */}
                    {segs.filter(s => s.who.departs && d(s.who.departs) < d(WIN1) && d(s.who.departs) > d(WIN0)).map(s => (
                      <span key={'t'+s.who.k} className="absolute z-20" style={{ left:pctOf(s.who.departs)+'%', top:0, bottom:0 }}>
                        <span className="block w-px h-full" style={{ background:'#BB0000' }} />
                      </span>
                    ))}
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      </div>
    </figure>
  );
}

/* ────────────────────────────────────────────────────────────────────────────
   FACULTY / PhD — HANDOFFS

    <div className="max-w-[1240px] mx-auto px-8 pb-32">

          [pending.length, pending.length === 1 ? 'handoff in flight' : 'handoffs in flight'],

/* ────────────────────────────────────────────────────────────────────────────
   UNDERGRADUATE — MY BENCH
   ──────────────────────────────────────────────────────────────────────────── */
function Bench({ projects, me, open, addEntry, setView, nudged }){
  const mine = projects.filter(p => (me.projects||[]).includes(p.id));
  const myDebts = mine.flatMap(p => debts(p).filter(x => x.student && (!x.owner || x.owner === me.k)).map(x => ({ ...x, p })));
  const myEntries = mine.flatMap(p => p.log.filter(e => authorsOf(e).some(a => a.k === me.k)).map(e => ({ e, p })))
                        .sort((a,b) => d(b.e.d) - d(a.e.d));
  const openNext = mine.flatMap(p => p.log.filter(e => e.t === 'next').map(e => ({ e, p })));
  const lastMine = myEntries[0];
  const incoming = me.state === 'incoming';
  const outgoing = me.state === 'outgoing';

  const title = incoming
    ? 'You are joining a project that is ' + spanMonths(mine[0].started) + ' months old.'
    : outgoing
      ? daysUntil(me.departs) + ' days left at this bench.'
      : 'Your log is ' + (lastMine ? ago(lastMine.e.d) : 'empty') + '.';

  const lede = incoming
    ? 'Nothing here expects you to know anything yet. Start with the brief — it is assembled from ' + mine[0].log.length + ' entries written by the three students who came before you.'
    : outgoing
      ? 'Everything you have written down goes with the project. Everything you have not written down leaves with you on ' + fmt(me.departs) + '.'
      : 'The log helps the next student see what has already been tried and where to continue.';

  return (
    <div className="max-w-[1240px] mx-auto px-8 pb-32">
      <Plate tone="warm" ghost={mine.length}
        eyebrow={'My bench · ' + me.line}
        title={title} lede={lede}
        figures={[
          [mine.length, mine.length === 1 ? 'project' : 'projects'],
          [myEntries.length, myEntries.length === 1 ? 'entry in your hand' : 'entries in your hand'],
          [openNext.length, openNext.length === 1 ? 'open next step' : 'open next steps'],
          [myDebts.length, 'things to close', myDebts.length ? 'ten minutes each' : 'all clear'],
        ]}
      />

      {incoming ? (
        <>
          <PageIntro what="You have not started yet, so this page is mostly a door. Everything behind it was written by someone who is about to leave." />
          <button onClick={() => setView('starthere')}
            className="group w-full text-left border hair rounded-[3px] bg-card px-7 py-7 lift rise flex items-center justify-between gap-6 flex-wrap"
            style={{ borderLeft:'3px solid #96720C' }}>
            <div>
              <Kicker style={{ color:'#96720C' }}>Read this first</Kicker>
              <div className="font-display text-[27px] leading-snug mt-2 max-w-[24ch]">Your start-here brief for {mine[0].name}</div>
              <p className="text-[13.5px] text-muted mt-2 measure">
                What has been tried, what worked, what did not, and the three places you can pick up.
                Roughly a nine-minute read that replaces about a semester of guessing.
              </p>
            </div>
            <span className="font-mono text-[11px] uppercase tracking-wider2 border-b border-ink pb-1 group-hover:tracking-[.24em] transition-all">Open brief →</span>
          </button>
          <QuestionsToAsk p={mine[0]} me={me} />
        </>
      ) : (
        <>
          <PageIntro what={outgoing
            ? 'What still lives only in your head, and what it would take to get it out. Your PI sees this same list as project risk.'
            : 'What you owe the log this week, and the open threads you could pick up. Your PI sees this same list as project risk.'} />

          {myDebts.length > 0 && (
            <section>
              <div className="flex items-baseline justify-between gap-4 flex-wrap">
                <h2 className="font-display text-[26px]">On your plate</h2>
                <span className="font-mono text-[10px] uppercase tracking-wider2 text-faint">Same rows your PI sees, phrased for you</span>
              </div>
              <div className="mt-5 space-y-3">
                {myDebts.map((x,i) => (
                  <div key={x.p.id+x.k} className="border hair rounded-[3px] bg-card px-5 py-4 flex items-start gap-4 rise"
                       style={{ animationDelay:(i*70)+'ms', borderLeft:'3px solid '+SEV[x.sev].c }}>
                    <div className="flex-1">
                      <div className="flex items-center gap-2.5 flex-wrap">
                        <span className="text-[14.5px]">{x.owner === me.k && x.hs ? x.hs : x.h}</span>
                        <Tag>{x.p.code}</Tag>
                        {nudged.includes(x.p.id+':'+x.k) && (
                          <span className="font-mono text-[9px] uppercase tracking-wider2 px-1.5 py-[1px] rounded-[2px]"
                                style={{ color:'#96720C', background:'rgba(150,114,12,.14)' }}>flagged by your PI</span>
                        )}
                      </div>
                      <p className="text-[13px] leading-relaxed text-muted mt-1.5 measure">{x.student}</p>
                    </div>
                    <button onClick={() => open(x.p.id)}
                      className="shrink-0 font-mono text-[9.5px] uppercase tracking-wider2 px-3 py-1.5 border hair rounded-[2px] hover:bg-ink hover:text-paper hover:border-ink transition-colors">
                      Open log

                  </div>

          <section className="mt-14">
            <h2 className="font-display text-[26px]">Open threads on your projects</h2>

              {openNext.map(({ e, p }, i) => (
                <button key={e.id} onClick={() => open(p.id)}
                  className="text-left border hair rounded-[3px] bg-card p-5 lift rise" style={{ animationDelay:(i*60)+'ms' }}>
                  <div className="flex items-center gap-2"><Mark t="next" size={15} /><Tag>{p.code}</Tag>
                    <span className="font-mono text-[9.5px] uppercase tracking-wider2 text-faint">open {ago(e.d).replace(' ago','')}</span></div>
                  <div className="font-display text-[17px] leading-snug mt-2.5">{e.h}</div>
                  <p className="text-[12.5px] leading-relaxed text-muted mt-1.5 line-clamp-3">{e.b}</p>

          <section className="mt-14">
            <div className="flex items-baseline justify-between gap-4 flex-wrap">
              <h2 className="font-display text-[26px]">File something</h2>
              <span className="font-mono text-[10px] uppercase tracking-wider2 text-faint">Add a quick project update</span>
            </div>
            <Composer projects={mine} me={me} pick onSave={(pid, e) => addEntry(pid, e, me)} />
          </section>

          {myEntries.length > 0 && (
            <section className="mt-14">
              <h2 className="font-display text-[26px]">In your hand</h2>
              <p className="text-[13.5px] text-muted mt-2 measure">Entries you wrote. The ones marked awaiting sign-off are with your PI.</p>
              <div className="mt-5 space-y-2.5">
                {myEntries.slice(0,6).map(({ e, p }) => (
                  <button key={e.id} onClick={() => open(p.id)} className="w-full text-left flex items-start gap-3.5 border-b hair pb-2.5 group">
                    <Mark t={e.t} size={16} />
                    <span className="flex-1">
                      <span className="block text-[14px] leading-snug"><span className="u-hover">{e.h}</span></span>
                      <span className="block font-mono text-[10px] text-faint mt-1">{fmt(e.d)} · {p.code}</span>
                    </span>
                    {e.ack === false && <span className="font-mono text-[9px] uppercase tracking-wider2 px-1.5 py-[2px] rounded-[2px] shrink-0"
                      style={{ color:'#96720C', background:'rgba(150,114,12,.14)' }}>awaiting sign-off</span>}
                    {e.ack === true && <span className="font-mono text-[9px] uppercase tracking-wider2 text-faint shrink-0">signed off</span>}
                  </button>
                ))}
              </div>
            </section>
          )}
        </>
      )}
    </div>
  );
}

/* Questions the incoming student cannot know to ask — derived, not authored */
function QuestionsToAsk({ p, me }){
  const out = onProject(p.id,'ug').find(x => x.state==='outgoing');
  const qs = [];
  p.log.filter(e => e.t==='deadend').forEach(e => qs.push({ e, q:'How far did you get before you called it? I want to recognise this failing early rather than late.' }));
  p.log.filter(e => e.t==='blocker').forEach(e => qs.push({ e, q:'What is the exact ritual here — who to email, at what time, and what it costs to miss it?' }));
  const ss = singleSource(p).live.filter(x => x.e.t==='method').slice(0,2);
  ss.forEach(({ e }) => qs.push({ e, q:'Yours is the only written account of this. Can I watch you do it once before you go?' }));

  return (
    <section className="mt-14">
      <h2 className="font-display text-[26px]">Questions to ask {out ? out.n.split(' ')[0] : 'the outgoing student'} before {out ? fmt(out.departs) : 'they leave'}</h2>
      <p className="text-[13.5px] text-muted mt-2 measure">
        Generated from entries that record a failure, a constraint, or a procedure with only one author —
        the three kinds of thing that read thin on paper and are obvious in person.
      </p>
      <ol className="mt-6 space-y-5">
        {qs.map(({ e, q }, i) => (
          <li key={e.id+i} className="grid grid-cols-[auto_1fr] gap-4 rise" style={{ animationDelay:(i*70)+'ms' }}>
            <span className="font-display text-[26px] leading-none font-light text-rule2 tnum">{String(i+1).padStart(2,'0')}</span>
            <div>
              <div className="flex items-center gap-2 flex-wrap">
                <Mark t={e.t} size={14} />
                <span className="font-mono text-[9.5px] uppercase tracking-wider2 text-faint">{fmt(e.d)} · {e.au}</span>
              </div>
              <div className="font-display text-[17px] leading-snug mt-1.5">{e.h}</div>
              <p className="text-[13.5px] leading-relaxed text-ink2 mt-1.5 measure italic font-display">“{q}”</p>
            </div>
          </li>
        ))}
      </ol>
    </section>
  );
}

/* ────────────────────────────────────────────────────────────────────────────
   UNDERGRADUATE — MY HANDOFF
   ──────────────────────────────────────────────────────────────────────────── */
function MyHandoff({ projects, me, open, goOnboard, checked, toggleCheck, briefsMade }){
  const p = projects.find(x => (me.projects||[]).includes(x.id));
  const inc = onProject(p.id,'ug').find(x => x.state==='incoming');
  const sole = soleAuthoredBy(p, me.k);
  const overlapDays = (handoffOverlap(p)||{}).days || 0;

  const items = [
    ...sole.map(e => ({ id:'s:'+e.id, h:'Thicken “' + e.h + '”', b:'You are the only written source for this. Add what a stranger would get wrong on their first attempt.', sev:3, e })),
    { id:'brief', h:'Generate the start-here brief for ' + inc.n, b:'It assembles itself from the log. Read it once as if you were them, and fix what reads thin.', sev:3, done:briefsMade.includes(p.id) },
    { id:'gate', h:'Walk ' + inc.n.split(' ')[0] + ' through a live FACS sort', b:'The gate procedure is written down, but nobody has ever learned it from the page alone.', sev:2 },
    { id:'freezer', h:'Transfer freezer box 4-C ownership', b:'Positions A1–A4 hold the unsorted round-3 library. It is the most valuable thing in the project and it is in your name.', sev:2 },
    { id:'contact', h:'Confirm you will answer email until 19 Dec', b:'Set the expectation now, in writing, so nobody is guessing in January.', sev:1 },
  ];
  const done = items.filter(x => checked.includes(x.id) || x.done).length;

  return (
    <div className="max-w-[1240px] mx-auto px-8 pb-32">
      <Plate tone="warm" ghost={daysUntil(me.departs)}
        eyebrow="My handoff"
        title="What still needs to be documented before you leave."
        lede={'You overlap with ' + inc.n + ' for ' + overlapDays + ' days. Use that overlap to go over anything that is still unclear or undocumented.'}
        figures={[
          [daysUntil(me.departs), 'days until you leave', fmt(me.departs)],
          [overlapDays, 'days of overlap', 'with ' + inc.n.split(' ')[0]],
          [sole.length, sole.length === 1 ? 'procedure only you wrote' : 'procedures only you wrote'],
          [done + '/' + items.length, 'handoff items closed'],
        ]}
      />

      <PageIntro what="This checklist is based on gaps in the project log and items that still depend on you." />

      {/* progress */}
      <div className="flex items-center gap-4 mb-8">
        <div className="flex-1 h-[10px] rounded-full overflow-hidden" style={{ background:'rgba(194,192,186,.7)' }}>
          <div className="h-full bar rounded-full" style={{ width:(done/items.length*100)+'%', background:'#4A4844' }} />
        </div>
        <span className="font-mono text-[11px] tnum text-ink2">{done} of {items.length}</span>
      </div>

      <div className="space-y-3">
        {items.map((x,i) => {
          const on = checked.includes(x.id) || x.done;
          return (
            <div key={x.id} className="border hair rounded-[3px] bg-card px-5 py-4 flex items-start gap-4 rise transition-opacity"
                 style={{ animationDelay:(i*70)+'ms', borderLeft:'3px solid '+SEV[x.sev].c, opacity: on ? .55 : 1 }}>
              <button onClick={() => toggleCheck(x.id)}
                className="mt-[2px] w-[18px] h-[18px] rounded-[3px] border grid place-items-center shrink-0 transition-colors"
                style={{ borderColor: on ? '#4A4844' : '#C2C0BA', background: on ? '#4A4844' : 'transparent', color:'#F2F1EE' }}>
                {on && <span className="text-[11px] leading-none">✓</span>}
              </button>
              <div className="flex-1">
                <div className={'text-[15px] leading-snug ' + (on ? 'line-through' : '')}>{x.h}</div>
                <p className="text-[13px] leading-relaxed text-muted mt-1 measure">{x.b}</p>
              </div>
              {x.id === 'brief' && (
                <button onClick={() => goOnboard(p.id)}
                  className="shrink-0 font-mono text-[9.5px] uppercase tracking-wider2 px-3 py-1.5 bg-ink text-paper rounded-[2px] hover:tracking-[.24em] transition-all">
                  {x.done ? 'Open' : 'Generate'}
                </button>
              )}
              {x.e && (
                <button onClick={() => open(p.id)}
                  className="shrink-0 font-mono text-[9.5px] uppercase tracking-wider2 px-3 py-1.5 border hair rounded-[2px] hover:bg-ink hover:text-paper hover:border-ink transition-colors">
                  Open entry
                </button>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

/* ────────────────────────────────────────────────────────────────────────────
   PROJECT DETAIL — the same log, framed by who is reading it
   ──────────────────────────────────────────────────────────────────────────── */
function ProjectDetail({ p, me, back, goOnboard, addEntry, ack, open }){
  const [active, setActive] = useState([]);
  const [composing, setComposing] = useState(false);
  const ci = continuity(p), c = counts(p), dd = debts(p);
  const log = sortedLog(p).filter(e => active.length === 0 || active.includes(e.t));
  const sup = me.tier !== 'ug';
  const mine = (me.projects||[]).includes(p.id);
  const mentor = mentorOf(p.id);
  const toggle = t => setActive(a => a.includes(t) ? a.filter(x => x!==t) : [...a, t]);

  return (
    <div className="max-w-[1240px] mx-auto px-8 pb-32">
      <button onClick={back} className="group font-mono text-[10px] uppercase tracking-wider2 text-faint hover:text-ink mt-8 flex items-center gap-2">
        <span className="inline-block group-hover:-translate-x-1 transition-transform">←</span> {sup ? 'Register' : 'Projects'}
      </button>

      <div className="mt-6 rise relative">
        <div className="flex items-center gap-2.5 flex-wrap">
          <Tag>{p.code}</Tag><Pill status={p.status} />
          <span className="font-mono text-[10px] uppercase tracking-wider2 text-faint">{p.field}</span>
        </div>
        <h1 className="font-display text-[46px] md:text-[60px] leading-[1.05] font-light mt-4 max-w-[19ch] -ml-[3px]">{p.name}</h1>
        <p className="font-display text-[17px] italic leading-relaxed text-ink2 mt-5 measure">{p.oneLine}</p>
        {p.status === 'archived' && (
          <span className="stamp hidden lg:block absolute right-4 top-8 font-mono text-[13px] uppercase" style={{ color:'rgba(111,109,105,.5)' }}>Archived</span>
        )}
      </div>

      {p.status === 'archived' && (
        <div className="mt-8 border hair rounded-[3px] bg-card px-6 py-5 rise" style={{ borderLeft:'3px solid #6F6D69' }}>
          <Kicker>Archived {fmt(p.archivedOn)} — not closed</Kicker>
          <p className="text-[13.5px] leading-relaxed text-ink2 mt-2 measure">{p.archiveNote}</p>
        </div>
      )}

      {/* the one banner that differs by lens */}
      {p.status === 'handoff' && (
        <button onClick={() => goOnboard(p.id)}
          className="group mt-8 w-full text-left border hair rounded-[3px] bg-card px-6 py-5 flex items-center justify-between gap-4 rise lift"
          style={{ borderLeft:'3px solid #96720C' }}>
          <div>
            <Kicker style={{ color:'#96720C' }}>Handoff pending</Kicker>
            <div className="font-display text-[19px] mt-1.5">
              {sup ? p.incoming.n + ' starts ' + fmt(p.incoming.starts) : mine ? 'Your successor starts ' + fmt(p.incoming.starts) : p.incoming.n + ' starts ' + fmt(p.incoming.starts)}
            </div>
            <div className="text-[13px] text-muted mt-1 measure">
              {sup ? p.incoming.background : 'Everything below that is not written down leaves with you.'}
            </div>
          </div>
          <span className="font-mono text-[11px] uppercase tracking-wider2 border-b border-ink pb-1 shrink-0 group-hover:tracking-[.24em] transition-all">Start-here brief →</span>
        </button>
      )}

      {/* meta band */}
      <div className="grid grid-cols-2 md:grid-cols-4 gap-y-6 mt-10 py-6 border-y hair rise">
        {[
          ['Principal investigator', p.pi, p.dept],
          ['PhD mentor', mentor ? mentor.n : '—', mentor ? mentor.line : 'none assigned'],
          ['Log entries', p.log.length, c.deadend + ' dead ends recorded'],
          ['Last activity', ago(sortedLog(p)[0].d), fmt(sortedLog(p)[0].d)],
        ].map(([k,v,sub]) => (
          <div key={k} className="pr-6">
            <Kicker>{k}</Kicker>
            <div className="text-[15px] mt-1.5 leading-snug">{v}</div>
            <div className="text-[12px] text-faint mt-0.5">{sub}</div>
          </div>
        ))}
      </div>

      <div className="grid grid-cols-12 gap-x-0 gap-y-10 lg:gap-x-10 mt-12">
        <div className="col-span-12 lg:col-span-8 min-w-0">
          <div className="flex items-center justify-between gap-4 flex-wrap">
            <h2 className="font-display text-[26px]">Continuity log</h2>
            {(mine || sup) && (
              <button onClick={() => setComposing(v => !v)}
                className="font-mono text-[10px] uppercase tracking-wider2 px-3 py-1.5 border hair rounded-[2px] hover:bg-ink hover:text-paper hover:border-ink transition-colors">
                {composing ? 'Cancel' : '+ Add entry'}
              </button>
            )}
          </div>
          <p className="text-[13px] text-muted mt-2 measure">
            Every entry is typed. The types exist because these are the things that vanish when a student leaves —
            especially the ones nobody publishes.
          </p>

          <div className="flex gap-1.5 mt-5 flex-wrap">
            {TYPE_ORDER.map(t => {
              const on = active.includes(t);
              return (
                <button key={t} onClick={() => toggle(t)} disabled={!c[t]} title={TYPES[t].blurb}
                  className={'flex items-center gap-1.5 font-mono text-[10px] uppercase tracking-wider2 px-2.5 py-1.5 rounded-[2px] border transition-all ' +
                    (!c[t] ? 'opacity-25 cursor-default border-transparent' : on ? 'text-paper' : 'hair hover:border-rule2') +
                    (TYPES[t].hatch && !on ? ' hatch' : '')}
                  style={on ? { background:TYPES[t].color, borderColor:TYPES[t].color } : {}}>
                  <span style={{ color: on ? '#F2F1EE' : TYPES[t].color }}>{TYPES[t].mark}</span>
                  {TYPES[t].label}<span className={on ? 'opacity-70' : 'text-faint'}>{c[t]}</span>
                </button>
              );
            })}
          </div>

          {composing && <Composer projects={[p]} me={me} onSave={(pid,e) => { addEntry(pid, e, me); setComposing(false); }} />}

          <div className="mt-8 relative">
            <div className="absolute left-[7px] top-2 bottom-2 w-px bg-rule" />
            {log.map((e,i) => <Entry key={e.id} e={e} i={i} sup={sup} me={me} onAck={() => ack(p.id, e.id)} />)}
            {log.length === 0 && <p className="font-display italic text-muted py-10 pl-8">Nothing of that type in this log.</p>}
            <div className="relative pl-8 pt-2">
              <span className="absolute left-0 top-[10px] w-[15px] h-[15px] rounded-full border hair bg-paper" />
              <Kicker>Project opened {fmt(p.started)}</Kicker>
            </div>
          </div>
        </div>

        <aside className="col-span-12 lg:col-span-4 min-w-0 space-y-9 lg:sticky lg:top-[150px] lg:self-start">
          <div>
            <Kicker>Continuity index</Kicker>
            <div className="flex items-end justify-between gap-4 mt-2">
              <div className="flex items-baseline gap-2">
                <span className="font-display text-[50px] leading-none font-light tnum">{ci.score}</span>
                <span className="font-display italic text-[15px] text-muted">{grade(ci.score)}</span>
              </div>
              <Meter ci={ci} wide />
            </div>
            <div className="mt-4 space-y-1.5">
              {ci.parts.map(x => (
                <div key={x.k} className="flex items-center justify-between gap-3 text-[11.5px]">
                  <span className="text-muted">{x.k}</span>
                  <span className="font-mono text-[10.5px] tnum text-ink2">{x.v.toFixed(0)}<span className="text-faint">/{x.max}</span></span>
                </div>
              ))}
            </div>
            <p className="text-[11.5px] text-faint leading-relaxed mt-3 border-t hair pt-3">
              A survivability estimate, not a quality score: if the student on this project stopped answering
              email tomorrow, how much of it survives?
            </p>
          </div>

          {dd.length > 0 && (
            <div>
              <Kicker className="mb-3">{sup ? 'Continuity debt' : 'What this project needs'}</Kicker>
              <div className="space-y-3">
                {dd.map(x => (
                  <div key={x.k} className="flex items-start gap-2.5">
                    <SevDot sev={x.sev} />
                    <div>
                      <div className="text-[13px] leading-snug">{x.h}</div>
                      <p className="text-[11.5px] text-muted leading-snug mt-0.5">{sup ? x.faculty : (x.student || x.faculty)}</p>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}

          <SideList title="People" items={p.contacts.map(x => ({ h:x.n, b:x.r, m:x.c }))} />
          <SideList title="Artifacts of record" items={p.artifacts.map(x => ({ h:x.n, b:x.d, mono:true }))} />
          <SideList title="Read first" items={p.reading.map(x => ({ h:x.n, b:x.d }))} />

          {p.alumni.length > 0 && (
            <div>
              <Kicker className="mb-3">Previously on this project</Kicker>
              <div className="space-y-3">
                {p.alumni.map(a => (
                  <div key={a.n} className="flex items-start gap-3">
                    <Avatar initials={a.i} dim />
                    <div><div className="text-[13.5px]">{a.n}</div><div className="text-[11.5px] text-faint">{a.r}</div></div>
                  </div>
                ))}
              </div>
            </div>
          )}
        </aside>
      </div>
    </div>
  );
}

function Entry({ e, i, sup, me, onAck }){
  const T = TYPES[e.t];
  const isDead = e.t === 'deadend';
  const isMine = authorsOf(e).some(a => a.k === me.k);
  return (
    <div className="relative pl-8 pb-9 rise" style={{ animationDelay:(i*45)+'ms' }}>
      <span className="absolute left-0 top-[3px] bg-paper p-[1px] rounded-full"><Mark t={e.t} size={15} /></span>
      <div className="flex items-center gap-3 flex-wrap">
        <span className="font-mono text-[10.5px] tnum text-ink2">{fmt(e.d)}</span>
        <span className="font-mono text-[10px] uppercase tracking-wider2" style={{ color:T.color }}>{T.label}</span>
        {e.sev === 'high' && <span className="font-mono text-[9.5px] uppercase tracking-wider2 px-1.5 py-[2px] rounded-[2px]" style={{ background:'rgba(187,0,0,.11)', color:'#BB0000' }}>costly</span>}
        <span className="font-mono text-[10px] text-faint">{e.au}{isMine ? ' · you' : ''}</span>
        {e.ack === false && (
          sup
            ? <button onClick={onAck} className="font-mono text-[9px] uppercase tracking-wider2 px-2 py-[3px] rounded-[2px] bg-ink text-paper hover:tracking-[.2em] transition-all">Sign off</button>
            : <span className="font-mono text-[9px] uppercase tracking-wider2 px-1.5 py-[2px] rounded-[2px]" style={{ color:'#96720C', background:'rgba(150,114,12,.14)' }}>awaiting sign-off</span>
        )}
      </div>
      <h3 className={'font-display text-[21px] leading-snug mt-2 measure ' + (isDead ? 'text-oxblood' : '')}>{e.h}</h3>
      <p className="text-[13.5px] leading-[1.7] text-ink2 mt-2 measure">{e.b}</p>
      {e.why && (
        <div className="mt-3 measure rounded-[3px] px-4 py-3" style={{ background:T.tint, borderLeft:'2px solid '+T.color }}>
          <div className="font-mono text-[9.5px] uppercase tracking-wider2 mb-1.5" style={{ color:T.color }}>
            {isDead ? 'What this cost, and why it will happen again' : 'Why — do not silently reverse this'}
          </div>
          <p className="text-[13px] leading-[1.7] text-ink2">{e.why}</p>
        </div>
      )}
    </div>
  );
}

function Composer({ projects, me, pick, onSave }){
  const [pid, setPid] = useState(projects[0].id);
  const [t, setT] = useState('result');
  const [h, setH] = useState(''); const [b, setB] = useState(''); const [why, setWhy] = useState('');
  const needsWhy = t === 'decision' || t === 'deadend';
  const ok = h.trim() && b.trim() && (!needsWhy || why.trim());
  const p = projects.find(x => x.id === pid) || projects[0];

  return (
    <div className="mt-6 border hair rounded-[3px] bg-card p-6 rise">
      {pick && projects.length > 1 && (
        <div className="mb-5">
          <Kicker className="mb-2">Project</Kicker>
          <select value={pid} onChange={e => setPid(e.target.value)}
            className="w-full bg-transparent border-b hair pb-2 font-display text-[18px] focus:border-ink transition-colors cursor-pointer">
            {projects.map(x => <option key={x.id} value={x.id}>{x.name}</option>)}
          </select>
        </div>
      )}
      <div className="flex gap-1.5 flex-wrap">
        {TYPE_ORDER.map(k => (
          <button key={k} onClick={() => setT(k)}
            className={'flex items-center gap-1.5 font-mono text-[10px] uppercase tracking-wider2 px-2.5 py-1.5 rounded-[2px] border transition-all ' +
              (t===k ? 'text-paper' : 'hair hover:border-rule2')}
            style={t===k ? { background:TYPES[k].color, borderColor:TYPES[k].color } : {}}>
            <span style={{ color: t===k ? '#F2F1EE' : TYPES[k].color }}>{TYPES[k].mark}</span>{TYPES[k].label}
          </button>
        ))}
      </div>
      <p className="font-display italic text-[13px] text-muted mt-3">{TYPES[t].blurb}</p>

      <input value={h} onChange={ev => setH(ev.target.value)} placeholder="One line — what happened"
        className="w-full mt-5 bg-transparent border-b hair pb-2 font-display text-[19px] placeholder:italic placeholder:text-faint focus:border-ink transition-colors" />
      <textarea value={b} onChange={ev => setB(ev.target.value)} rows={3}
        placeholder="Enough detail that someone who has never touched this can act on it."
        className="w-full mt-4 bg-transparent border-b hair pb-2 text-[13.5px] leading-relaxed placeholder:text-faint focus:border-ink transition-colors resize-none" />
      {needsWhy && (
        <textarea value={why} onChange={ev => setWhy(ev.target.value)} rows={2}
          placeholder={t==='deadend' ? 'Required — why did it fail, and what would make someone repeat it?' : 'Required — why this way, and what breaks if it is reversed?'}
          className="w-full mt-4 bg-transparent border-b pb-2 text-[13.5px] leading-relaxed placeholder:text-faint focus:border-ink transition-colors resize-none"
          style={{ borderColor: TYPES[t].color + '66' }} />
      )}
      <div className="flex items-center justify-between mt-5 gap-4 flex-wrap">
        <span className="text-[11.5px] text-faint">
          {needsWhy ? 'Decisions and dead ends require a “why”, and go to your PI for sign-off.' : 'Filed as ' + p.code + ' · today · ' + me.n}
        </span>
        <button disabled={!ok} onClick={() => { onSave(pid, { t, h:h.trim(), b:b.trim(), why: needsWhy ? why.trim() : undefined }); setH(''); setB(''); setWhy(''); }}
          className={'font-mono text-[10px] uppercase tracking-wider2 px-4 py-2 rounded-[2px] transition-all ' +
            (ok ? 'bg-ink text-paper hover:tracking-[.24em]' : 'bg-rule/60 text-faint cursor-not-allowed')}>
          File entry
        </button>
      </div>
    </div>
  );
}

/* ────────────────────────────────────────────────────────────────────────────
   THE BRIEF
   ──────────────────────────────────────────────────────────────────────────── */
const STEPS = ['Reading continuity log','Separating decisions from observations','Extracting recorded dead ends',
               'Resolving artifacts and freezer locations','Ranking open next steps','Composing brief'];

function Onboarding({ projects, initial, me, openProject, onMade, auto }){
  const first = auto ? projects.find(p => (me.projects||[]).includes(p.id)) : (projects.find(p => p.id === initial) || projects.find(p => p.status==='handoff') || projects[0]);
  const [pid, setPid] = useState(first.id);
  const [who, setWho] = useState('');
  const [phase, setPhase] = useState('idle');
  const [step, setStep] = useState(0);
  const p = projects.find(x => x.id === pid) || first;

  useEffect(() => {
    const incoming = onProject(p.id,'ug').find(x => x.state==='incoming');
    setWho(auto ? me.n : (incoming ? incoming.n : ''));
    setPhase('idle'); setStep(0);
  }, [pid]);

  function run(){
    setPhase('running'); setStep(0);
    STEPS.forEach((_,i) => setTimeout(() => setStep(i+1), 240 + i*280));
    setTimeout(() => { setPhase('done'); onMade(p.id); }, 240 + STEPS.length*280 + 220);
  }
  useEffect(() => { if (auto && phase === 'idle' && who) run(); }, [auto, who]);

  return (
    <div className="max-w-[1240px] mx-auto px-8 pb-32">
      {!auto && (
        <>
          <Plate tone="ink" eyebrow="Onboarding" ghost={p.log.length}
            title="Give new students a clear place to start."
            lede="The brief below is assembled from the continuity log. It gives the incoming student the information that has already been documented about the project." />
          <div className="no-print mt-8 border hair rounded-[3px] bg-card p-6 grid md:grid-cols-[1fr_1fr_auto] gap-6 items-end rise">
            <div>
              <Kicker className="mb-2">Project</Kicker>
              <select value={pid} onChange={e => setPid(e.target.value)}
                className="w-full bg-transparent border-b hair pb-2 font-display text-[19px] focus:border-ink transition-colors cursor-pointer">
                {projects.map(x => <option key={x.id} value={x.id}>{x.name}</option>)}
              </select>
            </div>
            <div>
              <Kicker className="mb-2">Incoming student</Kicker>
              <input value={who} onChange={e => setWho(e.target.value)} placeholder="Name"
                className="w-full bg-transparent border-b hair pb-2 font-display text-[19px] placeholder:italic placeholder:text-faint focus:border-ink transition-colors" />
            </div>
            <button onClick={run} disabled={phase==='running' || !who.trim()}
              className={'font-mono text-[10px] uppercase tracking-wider2 px-5 py-3 rounded-[2px] transition-all whitespace-nowrap ' +
                (phase==='running' || !who.trim() ? 'bg-rule/60 text-faint cursor-not-allowed' : 'bg-ink text-paper hover:tracking-[.24em]')}>
              {phase==='done' ? 'Re-assemble' : 'Assemble brief'}
            </button>
          </div>
        </>
      )}

      {phase==='idle' && !auto && (
        <p className="mt-16 text-center font-display italic text-[17px] text-faint">
          {p.log.length} entries · {spanMonths(p.started)} months · {counts(p).deadend} recorded dead ends
        </p>
      )}

      {phase==='running' && (
        <div className={'max-w-[560px] ' + (auto ? 'mt-24 mx-auto' : 'mt-12')}>
          {STEPS.map((s,i) => (
            <div key={s} className={'flex items-center gap-3 py-2 font-mono text-[11.5px] transition-opacity duration-300 ' + (i < step ? 'opacity-100' : 'opacity-20')}>
              <span className="w-3 text-ink">{i < step ? '✓' : i === step ? <span className="blink">▍</span> : '·'}</span>
              <span className={i < step ? 'text-ink2' : 'text-faint'}>{s}</span>
              <span className="flex-1 border-b border-dotted border-rule2 mx-1" />
              {i < step && <span className="text-faint tnum">{[p.log.length, counts(p).decision, counts(p).deadend, p.artifacts.length, counts(p).next, 'ok'][i]}</span>}
            </div>
          ))}
        </div>
      )}

      {phase==='done' && <Brief p={p} who={who} openProject={openProject} />}
    </div>
  );
}

function Brief({ p, who, openProject }){

          <span>{p.log.length} entries · {spanMonths(p.started)} months</span><span>·</span>
          <span>≈{Math.max(4, Math.round(words/180))} min read</span>

        <S n="1" title="Where things stand" delay={60}>
          <p className="dcap font-display text-[17.5px] leading-[1.72] text-ink measure">

            {outgoing ? ' ' + outgoing.n + (p.current[0] ? ' is the outgoing student, ' + outgoing.tenure + ' on the project.' : ' was the last student on it.') : ' No student is currently assigned.'}
            {' '}The log holds {p.log.length} entries: {c.decision} decisions, {c.method} methods, {c.result} results,
            {' '}{c.deadend} dead ends and {c.next} open next steps. The most recent is from {fmt(log[0].d)} ({ago(log[0].d)}).
          </p>
          <p className="font-display text-[17.5px] leading-[1.72] text-ink measure mt-4">
            {by('result')[0] ? 'Where the science stands — “' + by('result')[0].h + '”. ' : ''}
            {nexts[0] ? 'The most valuable thing sitting idle, open since ' + fmt(nexts[0].d) + ' — “' + nexts[0].h + '”.' : ''}
          </p>
          <div className="mt-6 flex gap-8 flex-wrap dbl pt-5">
            {[['Continuity index', continuity(p).score + ' · ' + grade(continuity(p).score)],

            ))}
          </div>
        </S>

        <S n="2" title="What worked" sub="Key results and methods to understand before continuing the project." delay={140}>
          <div className="space-y-6">
            {[...by('result'), ...by('method')].map(e => (
              <div key={e.id} className="grid grid-cols-[auto_1fr] gap-4">
                <Mark t={e.t} size={17} />
                <div>
                  <div className="font-display text-[18.5px] leading-snug">{e.h}</div>

        <S n="3" title="What did not work" sub="Previous approaches that did not work and should be reviewed before trying similar methods." delay={220}>

                <div className="flex items-center gap-2.5 flex-wrap">
                  <span style={{ color:'#BB0000' }} className="text-[13px]">⊘</span>
                  <span className="font-mono text-[10px] uppercase tracking-wider2" style={{ color:'#BB0000' }}>
                    {e.sev==='high' ? 'Cost: months' : e.sev==='med' ? 'Cost: weeks' : 'Shelved'}

              </div>
            ))}
            {by('deadend').length === 0 && <p className="font-display italic text-muted">No dead ends have been recorded yet.</p>}
          </div>
        </S>

        <S n="4" title="Decisions to understand before changing" sub="These decisions include the reasoning behind them. Discuss changes with the PI and document any updates." delay={300}>

                <span className="font-display text-[36px] leading-none font-light text-rule2 tnum">{String(i+1).padStart(2,'0')}</span>

                  <p className="text-[13.5px] leading-[1.7] text-ink2 mt-1.5 measure">{e.b}</p>
                  <div className="font-mono text-[10px] text-faint mt-1.5">Logged {fmt(e.d)} by {e.au} · open {ago(e.d).replace(' ago','')}</div>
                </div>
              </li>
            ))}
          </ol>
        </S>

        {by('blocker').length > 0 && (
          <S n="6" title="Standing constraints" sub="Not problems to solve. Facts about this lab to plan around." delay={460}>
            <div className="space-y-5">
              {by('blocker').map(e => (
                <div key={e.id} className="grid grid-cols-[auto_1fr] gap-4">
                  <Mark t="blocker" size={17} />
                  <div>
                    <div className="font-display text-[18px] leading-snug">{e.h}</div>
                    <p className="text-[13.5px] leading-[1.7] text-ink2 mt-1.5 measure">{e.b}</p>
                  </div>
                </div>
              ))}
            </div>
          </S>
        )}

        <S n={by('blocker').length ? '7' : '6'} title="People, files, reading" delay={540}>
          <div className="grid md:grid-cols-3 gap-8">
            <div><Kicker className="mb-3">Ask these people</Kicker>
              <div className="space-y-3">
                {mentor && <div><div className="text-[13.5px]">{mentor.n}</div><div className="text-[11.5px] text-muted leading-snug">{mentor.line} — first stop for anything procedural</div></div>}
                {p.contacts.map(x => (
                  <div key={x.n}><div className="text-[13.5px]">{x.n}</div>
                    <div className="text-[11.5px] text-muted leading-snug">{x.r}</div>
                    <div className="font-mono text-[10.5px] text-faint">{x.c}</div></div>
                ))}
              </div>
            </div>
            <div><Kicker className="mb-3">Files that matter</Kicker>
              <div className="space-y-3">{p.artifacts.map(x => (
                <div key={x.n}><div className="font-mono text-[11.5px] leading-snug break-words">{x.n}</div>
                  <div className="text-[11.5px] text-muted leading-snug">{x.d}</div></div>))}</div>
            </div>
            <div><Kicker className="mb-3">Read first</Kicker>
              <div className="space-y-3">{p.reading.map(x => (
                <div key={x.n}><div className="text-[13.5px] leading-snug">{x.n}</div>
                  <div className="text-[11.5px] text-muted leading-snug">{x.d}</div></div>))}</div>
            </div>
          </div>
        </S>

      <footer className="mt-16 pt-6 border-t hair flex items-center justify-between gap-6 flex-wrap no-print">
