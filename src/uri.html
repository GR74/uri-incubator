        <div className="flex items-center gap-2">
          <button onClick={() => openProject(p.id)} className="font-mono text-[10px] uppercase tracking-wider2 px-4 py-2 border hair rounded-[2px] hover:border-ink transition-colors">Open full log</button>
          <button onClick={() => window.print()} className="font-mono text-[10px] uppercase tracking-wider2 px-4 py-2 bg-ink text-paper rounded-[2px] hover:tracking-[.24em] transition-all">Print</button>
        </div>
      </footer>
    </article>
  );
}



/* ════════════════════════════════════════════════════════════════════════════
   STATE THAT SURVIVES A RELOAD — deep links + local persistence
   A demo that resets when someone bumps refresh is a demo you cannot trust.
   ════════════════════════════════════════════════════════════════════════════ */
const STORE = 'uri.demo.v3';

function saveState(o){
  try { localStorage.setItem(STORE, JSON.stringify(o)); } catch (e) {}
}
function loadState(){
  try { const raw = localStorage.getItem(STORE); return raw ? JSON.parse(raw) : null; } catch (e) { return null; }
}
function clearState(){ try { localStorage.removeItem(STORE); } catch (e) {} }

/* #/<person>/<view>/<id> */
function readHash(){
  const h = (location.hash || '').replace(/^#\/?/, '');
  if (!h) return null;
  const [who, view, id] = h.split('/');
  return { who, view, id: id || null };
}
function writeHash({ who, view, id }){
  const next = '#/' + who + '/' + view + (id ? '/' + id : '');
  if (location.hash !== next) history.replaceState(null, '', next);
}

/* ── universal search index ───────────────────────────────────────────────── */
function buildIndex({ projects, shelf, me, lens }){
  const out = [];
  TABS[lens](me).forEach(([k,label]) => out.push({ kind:'View', label, sub:'Go to ' + label.toLowerCase(), act:{ t:'view', v:k } }));
  PEOPLE.filter(p => p.tier !== 'alum' || true).forEach(p => {
    if (['ug','phd','pi','partner'].includes(p.tier))
      out.push({ kind:'Become', label:p.n, sub:p.line, act:{ t:'me', k:p.k } });
    out.push({ kind:'Person', label:p.n + ' — record', sub:p.line, act:{ t:'record', k:p.k } });
  });
  projects.forEach(p => out.push({ kind:'Project', label:p.name, sub:p.code + ' · ' + p.field, act:{ t:'project', k:p.id } }));
  shelf.forEach(s => out.push({ kind:'Shelf', label:s.name, sub:s.code + ' · shelved by ' + byKey(s.shelvedBy).n, act:{ t:'shelf', k:s.id } }));
  projects.forEach(p => p.log.forEach(e => out.push({
    kind:TYPES[e.t].label, label:e.h, sub:p.code + ' · ' + fmt(e.d) + ' · ' + e.au, act:{ t:'project', k:p.id } })));
  out.push({ kind:'Demo', label:'Start the walkthrough', sub:'Six guided stops through the whole loop', act:{ t:'tour' } });
  out.push({ kind:'Demo', label:'What this is', sub:'Reopen the orientation', act:{ t:'orient' } });
  out.push({ kind:'Demo', label:'Reset the demo', sub:'Clear saved state and reload the seed data', act:{ t:'reset' } });
  return out;
}
/* Ranked, not fuzzy-for-its-own-sake: an exact hit must always beat a
   subsequence hit, or searching "dead" returns Devon Park. */
function score(q, x){
  q = q.toLowerCase().trim();
  if (!q) return 0;
  const label = x.label.toLowerCase();
  const sub   = (x.sub || '').toLowerCase();
  const kind  = x.kind.toLowerCase();
  if (label.startsWith(q)) return 6;
  if (label.split(/[\s—·,:()’'"]+/).some(w => w.startsWith(q))) return 5;
  if (label.includes(q)) return 4;
  if (kind.includes(q)) return 3;
  if (sub.includes(q)) return 2;
  if (q.length >= 3 && label.length < 46) {      /* last resort only */
    let j = 0;
    for (const c of label) if (c === q[j]) j++;
    if (j === q.length) return 1;
  }
  return -1;
}

function Palette({ open, setOpen, index, run }){
  const [q, setQ] = useState('');
  const [sel, setSel] = useState(0);
  const inputRef = useRef(null);
  const listRef = useRef(null);

  const hits = useMemo(() => {
    if (!q.trim()) return index.filter(x => ['View','Become','Demo'].includes(x.kind)).slice(0, 12);
    return index.map(x => ({ x, s: score(q, x) }))
                .filter(r => r.s > 0)
                .sort((a,b) => b.s - a.s || a.x.label.length - b.x.label.length)
                .slice(0, 24).map(r => r.x);
  }, [q, index]);

  useEffect(() => { setSel(0); }, [q]);
  useEffect(() => { if (open) { setQ(''); setTimeout(() => inputRef.current && inputRef.current.focus(), 20); } }, [open]);
  useEffect(() => {
    if (!listRef.current) return;
    const el = listRef.current.children[sel];
    if (el && el.scrollIntoView) el.scrollIntoView({ block:'nearest' });
  }, [sel]);

  if (!open) return null;
  const groups = [];
  hits.forEach(h => {
    const g = groups.find(x => x.k === h.kind);
    if (g) g.items.push(h); else groups.push({ k:h.kind, items:[h] });
  });
  let flat = 0;

  return (
    <div className="fixed inset-0 z-[100] flex items-start justify-center pt-[12vh] px-4"
         style={{ background:'rgba(26,25,23,.42)', backdropFilter:'blur(3px)' }}
         onClick={() => setOpen(false)} role="dialog" aria-modal="true" aria-label="Search">
      <div onClick={e => e.stopPropagation()}
           className="w-full max-w-[620px] bg-card border hair rounded-[4px] overflow-hidden fade"
           style={{ boxShadow:'0 40px 90px -30px rgba(26,25,23,.7)' }}>
        <div className="flex items-center gap-3 px-5 py-4 border-b hair">
          <span className="font-mono text-[11px] uppercase tracking-wider2 text-faint shrink-0">Index</span>
          <input ref={inputRef} value={q} onChange={e => setQ(e.target.value)}
            placeholder="Search projects, people, entries, the shelf…"
            aria-label="Search the index"
            onKeyDown={e => {
              if (e.key === 'Escape') setOpen(false);
              if (e.key === 'ArrowDown') { e.preventDefault(); setSel(s => Math.min(hits.length-1, s+1)); }
              if (e.key === 'ArrowUp')   { e.preventDefault(); setSel(s => Math.max(0, s-1)); }
              if (e.key === 'Enter' && hits[sel]) { run(hits[sel].act); setOpen(false); }
            }}
            className="flex-1 bg-transparent font-display text-[19px] placeholder:italic placeholder:text-faint focus:outline-none" />
          <kbd className="font-mono text-[9.5px] uppercase tracking-wider2 text-faint border hair rounded-[2px] px-1.5 py-[3px] shrink-0">esc</kbd>
        </div>

        <div ref={listRef} className="max-h-[52vh] overflow-y-auto py-1">
          {groups.map(g => (
            <div key={g.k}>
              <div className="font-mono text-[9.5px] uppercase tracking-wider2 text-faint px-5 pt-3 pb-1.5">{g.k}</div>
              {g.items.map(h => {
                const i = flat++;
                return (
                  <button key={g.k + i} onMouseEnter={() => setSel(i)}
                    onClick={() => { run(h.act); setOpen(false); }}
                    className={'w-full text-left px-5 py-2.5 flex items-baseline gap-3 transition-colors ' + (sel===i ? 'bg-ink text-paper' : '')}>
                    <span className="text-[14px] leading-snug flex-1 truncate">{h.label}</span>
                    <span className={'font-mono text-[10px] truncate max-w-[42%] ' + (sel===i ? 'opacity-65' : 'text-faint')}>{h.sub}</span>
                  </button>
                );
              })}
            </div>
          ))}
          {hits.length === 0 && <p className="font-display italic text-muted px-5 py-8">Nothing matches “{q}”.</p>}
        </div>

        <div className="border-t hair px-5 py-2.5 flex items-center gap-4 font-mono text-[9.5px] uppercase tracking-wider2 text-faint">
          <span>↑↓ move</span><span>↵ open</span><span className="ml-auto">Everything in the group is in here</span>
        </div>
      </div>
    </div>
  );
}

/* ── a name you can click ─────────────────────────────────────────────────── */
function PersonLink({ p, dim, size, showLine, className='' }){
  const nav = useContext(NavCtx);
  if (!p) return null;

    <button onClick={e => { e.stopPropagation(); nav.openRecord(p.k); }}

        <span className="block text-[13px] leading-tight truncate u-hover group-hover/pl:bg-[length:100%_1px]">{p.n}</span>
        {showLine && <span className="block font-mono text-[9.5px] uppercase tracking-wider2 text-faint truncate">{p.line}</span>}
      </span>
    </button>
  );
}

/* ── revival readiness: can an undergraduate actually pick this up? ────────── */
function readiness(s, gone){
  const owner = byKey(s.shelvedBy);
  const cut = gone && gone.has && gone.has(s.shelvedBy);
  const record = Math.min(1, (s.built.length + s.deadends.length + s.decisions.length + s.remaining.length) / 9) * 20;
  const reach = (!owner || cut) ? 4
    : owner.tier === 'alum' ? (daysAgo(owner.departs) > 400 ? 5 : 10)
    : !owner.departs ? 20
    : daysUntil(owner.departs) < 250 ? 13
    : daysUntil(owner.departs) < 400 ? 16 : 20;
  const mats = s.materials.length
    ? (s.materials.reduce((a,m) => a + (m.state==='alive' ? 1 : m.state==='at-risk' ? .45 : 0), 0) / s.materials.length) * 20 : 6;
  const scope = s.weeks <= 14 ? 20 : s.weeks <= 22 ? 13 : 7;
  const skill = s.level === 'intro' ? 20 : s.level === 'mid' ? 14 : 8;
  return {
    score: Math.round(record + reach + mats + scope + skill),
    parts:[
      { k:'Written record',    v:record, max:20 },
      { k:'Owner reachable',   v:reach,  max:20 },
      { k:'Materials alive',   v:mats,   max:20 },
      { k:'Scope bounded',     v:scope,  max:20 },
      { k:'Skills learnable',  v:skill,  max:20 },
    ],
  };
}
function readGrade(n){ return n >= 80 ? 'Ready now' : n >= 62 ? 'Revivable' : n >= 42 ? 'Needs work first' : 'Closing'; }
function shelfDays(s){ return daysUntil(s.shelfLife.date); }

                      <div className="font-display text-[18.5px] leading-snug">{x.h}</div>
                      <span className="font-mono text-[9.5px] uppercase tracking-wider2 text-faint">≈{x.weeks} weeks</span>
                    </div>
                    <p className="text-[13.5px] leading-[1.7] text-ink2 mt-1.5 measure">{x.b}</p>
                  </div>

              ))}
            </ol>
          </Sec>

          <Sec n="6" title="Materials, and whether they are still alive" sub="Check whether the materials and data needed to continue are still available.">
            {redacted ? (
              <p className="font-display italic text-[15px] text-muted">
                Storage locations and inventory are internal-only. Available under a sponsored research agreement.
              </p>
            ) : (
              <div className="space-y-3">
                {s.materials.map((m,i) => (
                  <div key={i} className="flex items-start gap-3.5 border-b hair pb-3">

                    <div className="flex-1">
                      <div className="text-[14px] leading-snug">{m.n}</div>
                      <div className="font-mono text-[10.5px] text-faint mt-0.5 break-words">{m.where}</div>
                      <p className="text-[12.5px] text-muted mt-1 measure">{m.note}</p>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </Sec>

          <Sec n="7" title="What you would need, and what you would learn">
            <div className="grid md:grid-cols-3 gap-8">
              <div>
                <Kicker className="mb-3">You should already have</Kicker>
                <ul className="space-y-1.5">{s.skills.map(x => <li key={x} className="text-[13.5px]">{x}</li>)}</ul>
                <p className="text-[12px] text-muted mt-3 leading-snug">{LEVELS[s.level]}</p>
              </div>
              <div>
                <Kicker className="mb-3">You would learn</Kicker>
                <ul className="space-y-1.5">{s.learn.map(x => <li key={x} className="text-[13.5px]">{x}</li>)}</ul>
              </div>
              <div>
                <Kicker className="mb-3">Who mentors you</Kicker>
                {mentor ? (
                  <div className="flex items-start gap-3">
                    <Avatar initials={mentor.i} dim={mentor.tier==='alum'} />
                    <div>
                      <div className="text-[13.5px]">{mentor.n}</div>
                      <div className="text-[11.5px] text-muted leading-snug">{mentor.line}</div>
                      {owner.tier === 'alum' && <div className="text-[11.5px] mt-1" style={{ color:'#BB0000' }}>Original owner has graduated — mentorship falls to the group.</div>}
                    </div>
                  </div>
                ) : <p className="text-[13px] text-muted">Assigned on claim.</p>}
                <div className="mt-4"><Kicker className="mb-1">Principal investigator</Kicker><div className="text-[13.5px]">{s.pi}</div></div>
              </div>
            </div>
          </Sec>
        </div>

        {/* claim */}
        {canClaim && (
          <div className="mt-14 pt-8 dbl">
            {!confirming ? (
              <div className="flex items-center justify-between gap-6 flex-wrap">
                <p className="text-[13px] text-muted measure">
                  Claiming moves this off the shelf and onto your bench. Everything above becomes the opening
                  entries of its continuity log, so you inherit the record rather than a blank page.
                </p>
                <button onClick={() => setConfirming(true)}
                  className="font-mono text-[11px] uppercase tracking-wider2 px-6 py-3.5 bg-ink text-paper rounded-[2px] hover:tracking-[.26em] transition-all">
                  Claim this project
                </button>
              </div>
            ) : (
              <div className="border hair rounded-[3px] px-6 py-5" style={{ borderLeft:'3px solid #4A4844' }}>
                <div className="font-display text-[20px]">You are committing to about {s.weeks} weeks of work.</div>
                <ul className="mt-3 space-y-1.5 text-[13.5px] text-ink2">
                  <li>· {s.remaining.length} open threads, scoped by {byKey(s.shelvedBy).n}</li>
                  <li>· Mentored by {mentor ? mentor.n : 'the group'}, PI {s.pi}</li>
                  <li>· The window closes {fmt(s.shelfLife.date)} — {s.shelfLife.why.toLowerCase()}</li>
                </ul>
                <div className="flex items-center gap-3 mt-5">
                  <button onClick={() => onClaim(s.id)}
                    className="font-mono text-[10px] uppercase tracking-wider2 px-5 py-2.5 bg-ink text-paper rounded-[2px] hover:tracking-[.24em] transition-all">
                    Confirm — put it on my bench
                  </button>
                  <button onClick={() => setConfirming(false)}
                    className="font-mono text-[10px] uppercase tracking-wider2 px-4 py-2.5 border hair rounded-[2px] hover:border-ink transition-colors">
                    Not yet
                  </button>
                </div>
              </div>
            )}
          </div>
        )}
        {s.claimedBy && (
          <div className="mt-14 pt-8 dbl">
            <p className="font-display italic text-[17px] text-muted">
              Claimed by {byKey(s.claimedBy).n}. This project is running again.
            </p>
          </div>
        )}
      </article>
    </div>
  );
}

/* ════════════════════════════════════════════════════════════════════════════
   EXTRACTION — the write path
   The interview is the brief's outline, asked as questions. One schema, two
   faces: a form when you are leaving, a document when you are arriving.

function RowsEditor({ rows, setRows, fields, addLabel, max=4 }){
  const upd = (i,k,v) => setRows(rows.map((r,j) => j===i ? { ...r, [k]:v } : r));
  return (
    <div className="space-y-5">
      {rows.map((r,i) => (
        <div key={i} className="border hair rounded-[3px] p-4 relative" style={{ background:'rgba(250,250,248,.6)' }}>
          <button onClick={() => setRows(rows.filter((_,j) => j!==i))}
            className="absolute right-3 top-3 font-mono text-[10px] text-faint hover:text-oxblood transition-colors">remove</button>
          {fields.map(f => f.type === 'select' ? (
            <div key={f.k} className="mt-3 first:mt-0">
              <Kicker className="mb-1.5">{f.label}</Kicker>
              <select value={r[f.k]} onChange={e => upd(i,f.k,e.target.value)}
                className="w-full bg-transparent border-b hair pb-1.5 text-[13.5px] focus:border-ink transition-colors cursor-pointer">
                {f.options.map(o => <option key={o[0]} value={o[0]}>{o[1]}</option>)}
              </select>
            </div>
          ) : f.type === 'num' ? (
            <div key={f.k} className="mt-3 first:mt-0 max-w-[180px]">
              <Kicker className="mb-1.5">{f.label}</Kicker>
              <input type="number" min="1" value={r[f.k]} onChange={e => upd(i,f.k,+e.target.value)}
                className="w-full bg-transparent border-b hair pb-1.5 text-[13.5px] tnum focus:border-ink transition-colors" />
            </div>
          ) : f.type === 'area' ? (
            <textarea key={f.k} rows={2} value={r[f.k]} onChange={e => upd(i,f.k,e.target.value)} placeholder={f.ph}
              className="w-full mt-3 first:mt-0 bg-transparent border-b hair pb-1.5 text-[13.5px] leading-relaxed placeholder:text-faint focus:border-ink transition-colors resize-none" />
          ) : (
            <input key={f.k} value={r[f.k]} onChange={e => upd(i,f.k,e.target.value)} placeholder={f.ph}
              className="w-full mt-3 first:mt-0 bg-transparent border-b hair pb-1.5 font-display text-[16px] placeholder:italic placeholder:text-faint focus:border-ink transition-colors" />
          ))}
        </div>
      ))}
      {rows.length < max && (
        <button onClick={() => setRows([...rows, Object.fromEntries(fields.map(f => [f.k, f.type==='num' ? 4 : f.type==='select' ? f.options[0][0] : '']))])}
          className="font-mono text-[10px] uppercase tracking-wider2 px-3 py-2 border border-dashed rounded-[2px] text-muted hover:text-ink hover:border-ink transition-colors"
          style={{ borderColor:'#C2C0BA' }}>{addLabel}</button>
      )}
    </div>
  );
}

const STEP_TITLES = ['The project','Why you are stopping','What is built','What did not work','What is left','Materials and visibility'];

function Extraction({ me, projects, onPublish, setView }){
  const blank = {
    name:'', oneLine:'', mode:'bench', reason:'time', reasonText:'',
    built:[{h:'',b:''}], deadends:[{h:'',b:'',why:''}], decisions:[{h:'',b:'',why:''}],
    remaining:[{h:'',b:'',weeks:4}], materials:[{n:'',where:'',state:'alive',note:''}],
    skills:'', learn:'', level:'intro', weeks:12, shelfDate:'2027-06-30', shelfWhy:'', visibility:'internal', reviewed:false,
  };
  const [f, setF] = useState(blank);
  const [step, setStep] = useState(0);
  const [done, setDone] = useState(false);
  const set = (k,v) => setF(o => ({ ...o, [k]:v }));

  function fillExample(){
    const ex = EXAMPLES[me.k] || EXAMPLES.yusuf;
    setF({ ...blank, ...ex, skills:ex.skills.join(', '), learn:ex.learn.join(', '),
           materials:ex.materials.map(m => ({ ...m })), visibility:'internal' });
  }

  const okStep = [
    f.name.trim() && f.oneLine.trim(),
    f.reasonText.trim().length > 20,
    f.built.some(x => x.h.trim()),
    true,
    f.remaining.some(x => x.h.trim()),
    f.materials.some(x => x.n.trim()) && f.shelfWhy.trim() && (f.visibility === 'internal' || f.reviewed),
  ];
  const canPublish = okStep.every(Boolean);

  if (done) return (
    <div className="max-w-[1240px] mx-auto px-8 pb-32">
      <Plate tone="ink" eyebrow="Extraction complete" ghost="✓"
        title="The project has been added to the shelf."
        lede="The information you entered will become the starting record for the next student who takes on the project." />
      <div className="mt-10 flex items-center gap-3">
        <button onClick={() => setView('shelf')} className="font-mono text-[10px] uppercase tracking-wider2 px-5 py-3 bg-ink text-paper rounded-[2px] hover:tracking-[.24em] transition-all">See it on the shelf</button>
        <button onClick={() => { setF(blank); setStep(0); setDone(false); }} className="font-mono text-[10px] uppercase tracking-wider2 px-4 py-3 border hair rounded-[2px] hover:border-ink transition-colors">Shelve another</button>
      </div>
    </div>
  );

  return (
    <div className="max-w-[1240px] mx-auto px-8 pb-32">
      <Plate tone="warm" eyebrow="Extraction interview" ghost={step+1}
        title="Document the project while the details are still fresh."
        lede="These six questions capture the information the next student will need to understand and continue the project." />

      <div className="mt-10 grid grid-cols-12 gap-x-0 gap-y-10 lg:gap-x-10">
        {/* step rail */}
        <aside className="col-span-12 lg:col-span-3">
          <div className="lg:sticky lg:top-[150px] space-y-1">
            {STEP_TITLES.map((t,i) => (
              <button key={t} onClick={() => setStep(i)}
                className={'w-full text-left flex items-start gap-3 px-3 py-2.5 rounded-[2px] transition-colors ' +
                  (step===i ? 'bg-ink text-paper' : 'hover:bg-rule/40')}>
                <span className={'font-mono text-[10px] tnum mt-[3px] ' + (step===i ? 'opacity-70' : okStep[i] ? '' : 'text-faint')}
                      style={step!==i && okStep[i] ? { color:'#4A4844' } : {}}>
                  {okStep[i] && step!==i ? '✓' : String(i+1).padStart(2,'0')}
                </span>
                <span className="text-[13.5px] leading-snug">{t}</span>
              </button>
            ))}
            <button onClick={fillExample}
              className="w-full mt-4 font-mono text-[9.5px] uppercase tracking-wider2 px-3 py-2.5 border border-dashed rounded-[2px] text-muted hover:text-ink hover:border-ink transition-colors"
              style={{ borderColor:'#C2C0BA' }}>Fill with example ↯</button>
            <p className="text-[11px] text-faint leading-relaxed mt-2 px-1">For demonstration — populates every field with a real shelved project.</p>
          </div>
        </aside>

        {/* step body */}
        <div className="col-span-12 lg:col-span-9 min-w-0">
          <div className="flex items-baseline gap-3 dbl pt-3 pb-2 mb-6">
            <span className="font-mono text-[10px] text-faint tnum">§{step+1}</span>
            <h2 className="font-display text-[26px] leading-none">{STEP_TITLES[step]}</h2>

          {step === 0 && (

              </div>
            </div>
          )}

          {step === 5 && (
            <div className="space-y-9">
              <div>
                <h3 className="font-display text-[20px] mb-1">Materials, and whether they are still alive</h3>
                <p className="text-[13px] text-muted measure mb-4">
                  Note anything that could make the project difficult to restart, such as expiring reagents or inaccessible files.
                </p>
                <RowsEditor rows={f.materials} setRows={v => set('materials',v)} addLabel="+ Another item" max={5}
                  fields={[{ k:'n', ph:'What it is' }, { k:'where', ph:'Where it physically lives' },
                           { k:'state', type:'select', label:'Condition', options:[['alive','Alive'],['at-risk','At risk'],['gone','Gone']] },
                           { k:'note', type:'area', ph:'Expiry, quantity, anything that would surprise them.' }]} />
              </div>

              <div className="grid sm:grid-cols-2 gap-6">
                <div>
                  <Kicker className="mb-2">Shelf life — when does this stop being revivable</Kicker>
                  <input type="date" value={f.shelfDate} onChange={e => set('shelfDate', e.target.value)}
                    className="w-full bg-transparent border-b hair pb-2 text-[14px] focus:border-ink transition-colors" />
                </div>
                <div>
                  <Kicker className="mb-2">Why that date</Kicker>
                  <input value={f.shelfWhy} onChange={e => set('shelfWhy', e.target.value)} placeholder="Reagents expire, you graduate, the freezer goes"
                    className="w-full bg-transparent border-b hair pb-2 text-[14px] placeholder:text-faint focus:border-ink transition-colors" />
                </div>
              </div>

              {/* visibility — the disclosure gate */}
              <div className="border hair rounded-[3px] p-6" style={{ borderLeft:'3px solid #BB0000' }}>
                <Kicker className="mb-3" style={{ color:'#BB0000' }}>Visibility</Kicker>
                <div className="grid sm:grid-cols-2 gap-2">
                  {[['internal','Internal only','Visible to this university. The default, and the safe one.'],
                    ['partner','Partner-visible','Summary readable by outside organisations. Locations, inventory and raw data are never shared.']].map(([k,l,b]) => (
                    <button key={k} onClick={() => set('visibility',k)}
                      className={'text-left px-4 py-3 rounded-[2px] border transition-all ' + (f.visibility===k ? 'border-ink bg-rule/25' : 'hair hover:border-rule2')}>
                      <span className="font-mono text-[10px] uppercase tracking-wider2">{l}</span>
                      <span className="block text-[12.5px] text-muted mt-1 leading-snug">{b}</span>
                    </button>
                  ))}
                </div>
                {f.visibility === 'partner' && (
                  <div className="mt-5 rounded-[3px] px-5 py-4" style={{ background:'rgba(187,0,0,.06)' }}>
                    <p className="text-[13px] leading-relaxed text-ink2 measure">
                      <strong className="font-semibold">Describing unpublished work outside the university is a public disclosure.</strong>{' '}
                      That can forfeit patent rights in most countries immediately, and starts a twelve-month clock in the US.
                      Anything marked partner-visible is reviewed by the technology transfer office before it leaves.
                    </p>
                    <button onClick={() => set('reviewed', !f.reviewed)} className="flex items-start gap-3 mt-4 text-left">
                      <span className="mt-[2px] w-[18px] h-[18px] rounded-[3px] border grid place-items-center shrink-0"
                            style={{ borderColor: f.reviewed ? '#4A4844' : '#C2C0BA', background: f.reviewed ? '#4A4844' : 'transparent', color:'#F2F1EE' }}>
                        {f.reviewed && <span className="text-[11px] leading-none">✓</span>}
                      </span>
                      <span className="text-[13px] leading-snug">I have cleared this with the PI, and it contains nothing patentable that has not been filed.</span>
                    </button>
                  </div>
                )}
              </div>
            </div>
          )}

          {/* nav */}
          <div className="flex items-center justify-between gap-4 mt-10 pt-6 border-t hair flex-wrap">
            <button onClick={() => setStep(s => Math.max(0, s-1))} disabled={step===0}
              className={'font-mono text-[10px] uppercase tracking-wider2 px-4 py-2.5 rounded-[2px] transition-colors ' +
                (step===0 ? 'text-faint cursor-not-allowed' : 'border hair hover:border-ink')}>← Back</button>
            <span className="font-mono text-[10px] uppercase tracking-wider2 text-faint">
              {okStep.filter(Boolean).length} of 6 complete
            </span>
            {step < 5 ? (
              <button onClick={() => setStep(s => s+1)}
                className="font-mono text-[10px] uppercase tracking-wider2 px-5 py-2.5 bg-ink text-paper rounded-[2px] hover:tracking-[.24em] transition-all">Next →</button>
            ) : (
              <button disabled={!canPublish} onClick={() => { onPublish(f, me); setDone(true); }}
                className={'font-mono text-[10px] uppercase tracking-wider2 px-5 py-2.5 rounded-[2px] transition-all ' +
                  (canPublish ? 'bg-ink text-paper hover:tracking-[.24em]' : 'bg-rule/60 text-faint cursor-not-allowed')}>
                Publish to the shelf
              </button>
            )}
          </div>
          {!canPublish && step === 5 && (
            <p className="text-[12px] text-faint mt-3 text-right">
              Steps still open: {STEP_TITLES.filter((_,i) => !okStep[i]).join(', ')}
            </p>
          )}
        </div>
      </div>
    </div>
  );
}

/* ════════════════════════════════════════════════════════════════════════════
   THE RECORD — the log, read as a credential
   ════════════════════════════════════════════════════════════════════════════ */
function RecordView({ projects, shelf, me, who, shared, toggleShare, open, partnerLens }){
  const person = who || me;
  const mine = projects.filter(p => (person.projects||[]).includes(p.id) ||
                                    p.log.some(e => authorsOf(e).some(a => a.k === person.k)));
  const entries = mine.flatMap(p => p.log.filter(e => authorsOf(e).some(a => a.k === person.k)).map(e => ({ e, p })))
                      .sort((a,b) => d(b.e.d) - d(a.e.d));
  const signed = entries.filter(x => x.e.ack === true).length;
  const deadends = entries.filter(x => x.e.t === 'deadend').length;
  const revived = shelf.filter(s => s.claimedBy === person.k);
  const inherited = mine.filter(p => p.log.some(e => d(e.d) < d(person.joined || '2000-01-01')));
  const isShared = shared.includes(person.k);
  const learned = [...new Set(revived.flatMap(s => s.learn))];
  const procedures = mine.flatMap(p => p.log
    .filter(e => e.t === 'method' && authorsOf(e).some(a => a.k === person.k))
    .map(e => ({ e, p })));

  const claims = [
    inherited.length && { h:'Inherited a running project cold', b:'Picked up ' + inherited[0].name + ' with ' + inherited[0].log.length + ' entries of prior history and continued it.' },
    revived.length && { h:'Revived a shelved project', b:'Claimed ' + revived[0].name + ' off the shelf and restarted work someone else had stopped.' },
    deadends && { h:'Documented ' + pl(deadends,'dead end','dead ends'), b:'Wrote up approaches that failed, with the reasoning — the part of research that normally goes unrecorded.' },
    signed && { h:pl(signed,'entry','entries') + ' countersigned by a PI', b:'Each one reviewed by the principal investigator before it entered lab practice.' },
  ].filter(Boolean);

  return (
    <div className="max-w-[1240px] mx-auto px-8 pb-32">
      <Plate variant={partnerLens ? undefined : 'rule'} tone="warm" ghost={entries.length}
        eyebrow={partnerLens ? 'Researcher record' : 'My research record'}
        title={person.k === me.k ? 'Your research contributions.' : person.n}
        lede={person.k === me.k
          ? 'A timestamped record of your contributions, including methods, decisions, results, and approaches that did not work.'
          : partnerLens
            ? person.line + ' · has consented to share this record. Every entry is timestamped and countersigned by the project’s principal investigator.'
            : person.line + (person.tier === 'alum'
                ? ' · What they documented during their time in the group.'
                : ' · What they have written into the group’s record so far.')}
        figures={[
          [entries.length, entries.length === 1 ? 'entry authored' : 'entries authored'],
          [signed, 'countersigned'],
          [deadends, deadends === 1 ? 'dead end documented' : 'dead ends documented'],
          [mine.length, mine.length === 1 ? 'project' : 'projects'],
        ]}
      />

      {!partnerLens && (
        <div className="mt-8 border hair rounded-[3px] bg-card px-6 py-5 flex items-start justify-between gap-6 flex-wrap rise">
          <div className="max-w-[54ch]">
            <Kicker className="mb-1.5">Sharing</Kicker>
            <div className="font-display text-[19px]">{isShared ? 'Visible to partner organisations' : 'Private to the university'}</div>
            <p className="text-[13px] text-muted mt-1.5 leading-relaxed">
              Sharing shows partners this record — your projects, entry counts and countersignatures. It never
              shows unpublished results, storage locations, or data. You can revoke it at any time, and revoking
              removes it immediately.
            </p>
          </div>
          <button onClick={() => toggleShare(person.k)}
            className={'font-mono text-[10px] uppercase tracking-wider2 px-4 py-2.5 rounded-[2px] transition-all shrink-0 ' +
              (isShared ? 'border hair hover:border-ink' : 'bg-ink text-paper hover:tracking-[.24em]')}>
            {isShared ? 'Revoke sharing' : 'Share with partners'}
          </button>
        </div>
      )}

      <PageIntro what={partnerLens
        ? 'This record summarizes documented research contributions, including methods, decisions, and approaches that did not work.'
        : 'Your research record is built from the entries you add during each project.'} />

      <section>
        <h2 className="font-display text-[26px]">What this record shows</h2>
        <div className="mt-5 grid md:grid-cols-2 gap-4">
          {claims.map((c,i) => (
            <div key={c.h} className="border hair rounded-[3px] bg-card px-5 py-4 rise" style={{ animationDelay:(i*70)+'ms' }}>
              <div className="font-display text-[18px] leading-snug">{c.h}</div>
              <p className="text-[13px] text-muted mt-1.5 leading-relaxed">{c.b}</p>
            </div>
          ))}
        </div>
      </section>

      {learned.length > 0 && (
        <section className="mt-14">
          <h2 className="font-display text-[26px]">Techniques picked up</h2>
          <p className="text-[13.5px] text-muted mt-2 measure">From projects they revived off the shelf — what the work taught, as stated by whoever shelved it.</p>
          <div className="flex flex-wrap gap-2 mt-5">
            {learned.map(t => <span key={t} className="font-mono text-[10.5px] px-3 py-1.5 rounded-[2px] border hair">{t}</span>)}
          </div>
        </section>
      )}

      {procedures.length > 0 && (
        <section className="mt-14">
          <h2 className="font-display text-[26px]">Procedures they wrote down</h2>
          <p className="text-[13.5px] text-muted mt-2 measure">
            Method entries in their own hand. These are the lab’s working instructions now — the clearest
            evidence that someone understood a technique well enough to hand it on.
          </p>
          <div className="mt-5 space-y-3">
            {procedures.map(({ e, p }) => (
              <div key={e.id} className="flex items-start gap-3 border-b hair pb-3">
                <Mark t="method" size={15} />
                <div className="flex-1">
                  <div className="text-[14px] leading-snug">{e.h}</div>
                  <div className="font-mono text-[10px] text-faint mt-0.5">{fmt(e.d)} · {p.code}</div>
                </div>
              </div>
            ))}
          </div>
        </section>
      )}

      <section className="mt-14">
        <h2 className="font-display text-[26px]">Contributions</h2>
        <p className="text-[13.5px] text-muted mt-2 measure">Every entry, newest first. Countersigned entries were reviewed by the PI.</p>
        <div className="mt-6 relative">
          <div className="absolute left-[7px] top-2 bottom-2 w-px bg-rule" />
          {entries.map(({ e, p },i) => (
            <div key={e.id} className="relative pl-8 pb-7 rise" style={{ animationDelay:(i*45)+'ms' }}>
              <span className="absolute left-0 top-[3px] bg-paper p-[1px] rounded-full"><Mark t={e.t} size={15} /></span>
              <div className="flex items-center gap-3 flex-wrap">
                <span className="font-mono text-[10.5px] tnum text-ink2">{fmt(e.d)}</span>
                <span className="font-mono text-[10px] uppercase tracking-wider2" style={{ color:TYPES[e.t].color }}>{TYPES[e.t].label}</span>
                <Tag>{p.code}</Tag>
                {e.ack === true && <span className="font-mono text-[9px] uppercase tracking-wider2 px-1.5 py-[2px] rounded-[2px]" style={{ color:'#4A4844', background:'rgba(74,72,68,.12)' }}>countersigned</span>}
              </div>
              <button onClick={() => open && open(p.id)} className="group text-left block">
                <div className="font-display text-[19px] leading-snug mt-1.5 measure"><span className="u-hover">{e.h}</span></div>
              </button>
              <p className="text-[13px] leading-[1.7] text-ink2 mt-1.5 measure">{e.b}</p>
            </div>
          ))}
          {entries.length === 0 && <p className="font-display italic text-muted pl-8 py-6">No entries yet. File one and it lands here.</p>}
        </div>
      </section>
    </div>
  );
}

/* ════════════════════════════════════════════════════════════════════════════
   PARTNER LENS — what leaves the university, and what does not
   ════════════════════════════════════════════════════════════════════════════ */
function PartnerView({ shelf, projects, me, shared, sub, openItem, openRecord }){
  const visible = shelf.filter(s => s.visibility === 'partner' && !s.claimedBy);
  const hidden = shelf.filter(s => s.visibility !== 'partner' || s.claimedBy).length;
  const people = shared.map(byKey).filter(Boolean);

  if (sub === 'talent') return (
    <div className="max-w-[1240px] mx-auto px-8 pb-32">
      <Plate tone="ink" ghost={people.length}
        eyebrow="Researchers"
        title="Researcher work records"
        lede="Each record summarizes a student’s documented research contributions, including methods, decisions, and unsuccessful approaches."
        figures={[
          [people.length, pl(people.length,'record','records').split(' ')[1] + ' shared'],
          [people.reduce((a,p) => a + projects.flatMap(x => x.log.filter(e => authorsOf(e).some(y=>y.k===p.k))).length, 0), 'entries authored'],
          ['—', 'unpublished results shown', 'by policy'],
          ['—', 'contact details shown', 'introductions are brokered'],

      <PageIntro what="Consent-based. You see what each student chose to make visible, and nothing else." />
      <div className="grid md:grid-cols-2 gap-5">
        {people.map((p,i) => {
          const es = projects.flatMap(x => x.log.filter(e => authorsOf(e).some(y=>y.k===p.k)));
          return (
            <button key={p.k} onClick={() => openRecord(p.k)}
              className="text-left border hair rounded-[3px] bg-card p-6 lift rise" style={{ animationDelay:(i*80)+'ms' }}>
              <div className="flex items-center gap-3.5">
                <Avatar initials={p.i} size="lg" />
                <div>
                  <div className="font-display text-[21px] leading-tight">{p.n}</div>
                  <div className="font-mono text-[10px] uppercase tracking-wider2 text-faint mt-1">{p.line}</div>
                </div>
              </div>
              <div className="flex gap-7 mt-5 pt-4 border-t hair">
                {[[es.length,'entries'],[es.filter(e=>e.ack===true).length,'countersigned'],[es.filter(e=>e.t==='deadend').length,'dead ends']].map(([n,l]) => (
                  <div key={l}><div className="font-display text-[24px] leading-none font-light tnum">{n}</div>
                    <div className="font-mono text-[9px] uppercase tracking-wider2 text-faint mt-1">{l}</div></div>
                ))}
              </div>
              <span className="inline-block mt-5 font-mono text-[10px] uppercase tracking-wider2 border-b border-ink pb-0.5">Read the record →</span>
            </button>
          );
        })}
        {people.length === 0 && (
          <p className="font-display italic text-[17px] text-muted py-10">
            No students have shared a record yet. Switch to an undergraduate account and enable sharing on My record.
          </p>
        )}
      </div>
    </div>
  );

  return (
    <div className="max-w-[1240px] mx-auto px-8 pb-32">
      <Plate tone="ink" ghost={visible.length}
        eyebrow="Open projects"
        title="Projects available for continuation."
        lede="These projects already have preliminary work completed but were paused before they were finished. Outside partners can support their continuation."
        figures={[
          [visible.length, pl(visible.length,'project','projects').split(' ')[1] + ' listed'],
          [hidden, 'withheld', 'internal only'],
          ['—', 'raw data shown', 'by policy'],
          ['—', 'storage locations shown', 'by policy'],
        ]} />

      <div className="mt-8 border hair rounded-[3px] bg-card px-6 py-5 rise" style={{ borderLeft:'3px solid #BB0000' }}>
        <Kicker style={{ color:'#BB0000' }}>What you are not seeing</Kicker>
        <p className="text-[13.5px] leading-relaxed text-ink2 mt-2 measure">
          {hidden} of {shelf.length} projects are internal-only and do not appear here. Describing unpublished work
          outside the university is a public disclosure that can forfeit patent rights, so listings are opt-in,
          reviewed by the technology transfer office, and stripped of locations, inventory and raw data.
          Anything further happens under a sponsored research agreement.
        </p>
      </div>

      <PageIntro what="This view provides enough information to evaluate potential interest while keeping internal project details private." />

      <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-5">
        {visible.map((s,i) => <ShelfCard key={s.id} s={s} i={i} me={me} onOpen={() => openItem(s.id)} />)}
      </div>

      <div className="mt-10 flex items-center gap-3 flex-wrap">
        <button className="font-mono text-[10px] uppercase tracking-wider2 px-5 py-3 bg-ink text-paper rounded-[2px] hover:tracking-[.24em] transition-all">Request an introduction</button>
        <button className="font-mono text-[10px] uppercase tracking-wider2 px-4 py-3 border hair rounded-[2px] hover:border-ink transition-colors">Sponsor a revival</button>
        <span className="font-mono text-[10px] uppercase tracking-wider2 text-faint">Routed through the research office</span>
      </div>
    </div>
  );
}


/* ════════════════════════════════════════════════════════════════════════════
   WHAT WOULD BE LOST — not a projection. The same log, recounted with one
   person's entries treated as unreachable.
   ════════════════════════════════════════════════════════════════════════════ */
function simulate(projects, shelf, goneKeys){
  const gone = new Set(goneKeys);
  const orphaned = [];
  projects.forEach(p => p.log.forEach(e => {
    if (!PROCEDURAL.includes(e.t)) return;
    const au = authorsOf(e);
    if (au.length !== 1) return;
    const who = au[0];
    if (who.tier === 'alum') return;            /* already orphaned — not newly lost */
    if (gone.has(who.k)) orphaned.push({ e, p, who });
  }));
  const emptied = projects.filter(p => p.status !== 'archived'
    && onProject(p.id,'ug').filter(x => (x.state==='active' || x.state==='outgoing') && !gone.has(x.k)).length === 0
    && onProject(p.id,'ug').filter(x => (x.state==='active' || x.state==='outgoing')).length > 0);
  const mentorless = projects.filter(p => { const m = mentorOf(p.id); return m && gone.has(m.k); });
  const shelfHit = shelf.filter(s => !s.claimedBy && gone.has(s.shelvedBy))
    .map(s => ({ s, before: readiness(s).score, after: readiness(s, gone).score }));
  return { orphaned, emptied, mentorless, shelfHit };
}

function Simulator({ projects, shelf, me }){
  const [gone, setGone] = useState([]);
  const cast = PEOPLE.filter(x => (x.tier === 'ug' && x.state !== 'incoming' || x.tier === 'phd')
    && projects.some(p => (x.projects||[]).includes(p.id)));
  const r = simulate(projects, shelf, gone);
  const names = gone.map(k => byKey(k).n);
  const toggle = k => setGone(g => g.includes(k) ? g.filter(x => x!==k) : [...g, k]);

  const headline = names.length === 0 ? null
    : names.length === 1 ? 'If ' + names[0] + ' stopped answering email tonight'
    : names.length === 2 ? 'If ' + names[0] + ' and ' + names[1] + ' both left'
    : 'If ' + names.slice(0,-1).join(', ') + ' and ' + names[names.length-1] + ' all left';

  return (
    <section id="sim" className="mt-14 border hair rounded-[3px] bg-card overflow-hidden">
      <div className="px-6 py-5 border-b hair flex items-start justify-between gap-6 flex-wrap">
        <div>
          <Kicker style={{ color:'#BB0000' }}>What would be lost</Kicker>
          <h2 className="font-display text-[25px] leading-snug mt-1.5">Select a person to see the impact of their departure.</h2>
          <p className="text-[13px] text-muted mt-1.5 measure">
            Nothing here is projected. It is the same log, recounted with their entries treated as
            unreachable — which is exactly what a graduation does.
          </p>
        </div>
        {gone.length > 0 && (
          <button onClick={() => setGone([])}
            className="font-mono text-[10px] uppercase tracking-wider2 px-3 py-1.5 border hair rounded-[2px] hover:border-ink transition-colors shrink-0">
            Put everyone back
          </button>
        )}
      </div>

      <div className="px-6 py-5 flex flex-wrap gap-2 border-b hair">
        {cast.map(x => {
          const on = gone.includes(x.k);
          return (
            <button key={x.k} onClick={() => toggle(x.k)} aria-pressed={on}
              className={'flex items-center gap-2.5 pl-2 pr-3.5 py-1.5 rounded-[3px] border transition-all ' +
                (on ? 'text-paper' : 'hair hover:border-rule2')}
              style={on ? { background:'#BB0000', borderColor:'#BB0000' } : {}}>
              <span className={'w-7 h-7 shrink-0 rounded-full grid place-items-center font-mono text-[10px] border ' +
                (on ? 'line-through' : '')}
                style={{ borderColor: on ? 'rgba(242,241,238,.5)' : '#C2C0BA', color: on ? '#F2F1EE' : '#6F6D69' }}>{x.i}</span>
              <span className="text-left">
                <span className="block text-[13px] leading-tight">{x.n}</span>
                <span className={'block font-mono text-[9px] uppercase tracking-wider2 ' + (on ? 'opacity-70' : 'text-faint')}>
                  {on ? 'gone' : x.tier === 'phd' ? 'PhD mentor' : 'undergraduate'}
                </span>
              </span>
            </button>
          );
        })}
      </div>

      {gone.length === 0 ? (
        <p className="font-display italic text-[16px] text-muted px-6 py-9">
          Select a person above to see how their departure would affect the projects.
        </p>
      ) : (
        <div className="px-6 py-7">
          <h3 className="font-display text-[22px] leading-snug">{headline}:</h3>

          <div className="grid grid-cols-2 md:grid-cols-4 gap-y-6 mt-6 pt-5 dbl">
            {[[r.orphaned.length, r.orphaned.length === 1 ? 'procedure loses its only living author' : 'procedures lose their only living author'],
              [r.emptied.length, r.emptied.length === 1 ? 'project left with no undergraduate' : 'projects left with no undergraduate'],
              [r.mentorless.length, r.mentorless.length === 1 ? 'project loses its PhD mentor' : 'projects lose their PhD mentor'],
              [r.shelfHit.length, r.shelfHit.length === 1 ? 'shelved project gets harder to revive' : 'shelved projects get harder to revive']]
              .map(([n,l],i) => (
                <div key={l} className="pr-4 rise" style={{ animationDelay:(i*70)+'ms' }}>
                  <div className="font-display text-[38px] leading-none font-light tnum"
                       style={{ color: n > 0 ? '#BB0000' : '#9C9A95' }}>{n}</div>
                  <div className="font-mono text-[9.5px] uppercase tracking-wider2 text-muted mt-2 leading-relaxed">{l}</div>
                </div>
            ))}
          </div>

          {r.orphaned.length > 0 && (
            <div className="mt-8">
              <Kicker className="mb-3">These would have no living author</Kicker>
              <div className="space-y-2.5">
                {r.orphaned.map(({ e, p }) => (
                  <div key={e.id} className="flex items-start gap-3 border-b hair pb-2.5">
                    <Mark t={e.t} size={15} />
                    <div className="flex-1 min-w-0">
                      <div className="text-[14px] leading-snug">{e.h}</div>

}

/* ════════════════════════════════════════════════════════════════════════════
   THE PERSON MODEL
   Ask only for what no log can observe -- time, eligibility, intent. Derive the
   rest from entries the student already wrote, show what was derived, and let
   them correct it. A declared skills form would contradict the whole product.
   ════════════════════════════════════════════════════════════════════════════ */
const CERTS = {
  safety: { label:'General lab safety',      hours:1, note:'Required to be in any wet lab unsupervised.' },
  bsl2:   { label:'BSL-2 biosafety',         hours:2, note:'Recombinant organisms, including routine E. coli work.' },
  iacuc:  { label:'IACUC animal handling',   hours:2, note:'Any procedure involving vertebrate animals.' },
  irb:    { label:'IRB human subjects',      hours:2, note:'Any data collected from people.' },
  rad:    { label:'Radiation safety',        hours:3, note:'Sealed sources and radiolabelled reagents.' },
};
const GOALS = {
  paper:  'A paper or a poster',
  thesis: 'A senior thesis',
  breadth:'A range of techniques',
  decide: 'To find out whether research is for me',
  grad:   'A grad school application',
  med:    'A medical school application',
};
const LIMITS = {
  'no-animal':  'No animal work',
  'no-early':   'No early mornings',
  'computational':'Computational only',
  'term-only':  'Term time only, not summer',
};
const BLANK_PROFILE = { hours:8, grad:'', certs:[], prior:'', goals:[], limits:[], confirms:{}, done:false };

/* what the log already knows -- no form required */
function derived(person, projects){
  const methods = [];
  projects.forEach(p => p.log.forEach(e => {
    if (e.t === 'method' && authorsOf(e).some(a => a.k === person.k)) methods.push({ e, p });
  }));
  const touched = projects.filter(p => p.log.some(e => authorsOf(e).some(a => a.k === person.k))
                                    || (person.projects||[]).includes(p.id));
  const entries = projects.flatMap(p => p.log.filter(e => authorsOf(e).some(a => a.k === person.k)));
  return { methods, touched, entries,
           deadends: entries.filter(e => e.t === 'deadend').length,
           signed:   entries.filter(e => e.ack === true).length };
}

/* eligibility is a hard gate, not a preference -- exactly the sort of constraint
   a symbolic layer should own */
function eligibility(profile, shelf){
  const held = new Set(profile.certs || []);
  const open = [], locked = [];
  shelf.filter(s => !s.claimedBy).forEach(s => {
    const missing = (s.requires || []).filter(r => !held.has(r));
    (missing.length ? locked : open).push({ s, missing });
  });
  const byCert = {};
  locked.forEach(({ s, missing }) => missing.forEach(c => {
    byCert[c] = byCert[c] || [];
    byCert[c].push(s);
  }));
  return { open, locked, byCert };
}

/* ranking only -- nothing is ever hidden from a student */
function fitScore(s, profile){
  let n = 50;
  const termWeeks = Math.max(4, (profile.hours || 8) * 1.6);
  n += s.weeks <= termWeeks ? 12 : -6;
  if ((profile.limits||[]).includes('computational') && s.mode !== 'computational') n -= 22;
  if ((profile.limits||[]).includes('no-animal') && /mouse|animal|surgery/i.test(s.name + s.oneLine)) n -= 25;
  if ((profile.goals||[]).includes('breadth')) n += s.learn.length * 2;
  if ((profile.goals||[]).includes('paper') && /write|methods note|manuscript/i.test(JSON.stringify(s.remaining))) n += 10;
  if ((profile.goals||[]).includes('decide') && s.level === 'intro') n += 10;
  const missing = (s.requires || []).filter(r => !(profile.certs||[]).includes(r)).length;
  n -= missing * 15;
  return n;
}

function Chips({ options, value, onChange, multi=true }){
  return (
    <div className="flex flex-wrap gap-2">
      {Object.entries(options).map(([k, label]) => {
        const on = multi ? value.includes(k) : value === k;
        return (
          <button key={k} type="button" aria-pressed={on}
            onClick={() => onChange(multi ? (on ? value.filter(x => x !== k) : [...value, k]) : k)}
            className={'text-[13px] px-3.5 py-2 rounded-[3px] border transition-all ' +
              (on ? 'bg-ink text-paper border-ink' : 'hair hover:border-rule2')}>{label}</button>
        );
      })}
    </div>
  );
}

/* ── the living profile ──────────────────────────────────────────────────── */

            ['Looking for', p.goals.map(g => GOALS[g]).join(', ') || '—']].map(([k, v]) => (
            <div key={k}><Kicker>{k}</Kicker><div className="text-[14px] mt-1.5 leading-snug">{v}</div></div>
          ))}
        </div>
        {p.prior && (
          <div className="mt-6"><Kicker>Experience elsewhere</Kicker>
            <p className="text-[14px] leading-relaxed mt-1.5 measure">{p.prior}</p></div>
        )}
        {p.limits.length > 0 && (
          <div className="mt-6"><Kicker>Ruled out</Kicker>
            <p className="text-[14px] mt-1.5">{p.limits.map(l => LIMITS[l]).join(' · ')}</p></div>
        )}
      </section>

      <section className="mt-14 border-t hair pt-8">
        <h2 className="font-display text-[22px]">How this is used</h2>
        <div className="mt-4 space-y-2.5 measure">
          {['The shelf is reordered for you, never filtered. Everything stays visible, and anything gated says so.',
            'Your brief expands the parts you have not done before and stays short on the parts you have.',
            'Dead ends are always shown in full, whatever your profile says. A failure record is never something you are judged ready for.',
           ].map(t => (
            <div key={t} className="flex items-start gap-3">
              <span className="w-[5px] h-[5px] rounded-full shrink-0 mt-[8px]" style={{ background:'#4A4844' }} />
              <p className="text-[13.5px] leading-relaxed text-ink2">{t}</p>
            </div>
          ))}
        </div>
        <button onClick={() => setView('shelf')}
          className="mt-7 font-mono text-[10px] uppercase tracking-wider2 px-5 py-3 bg-ink text-paper rounded-[2px] hover:tracking-[.26em] transition-all">
          See the shelf, ordered for you →
        </button>
      </section>
    </div>
  );
}

/* ────────────────────────────────────────────────────────────────────────────
   APP
   ──────────────────────────────────────────────────────────────────────────── */
function App(){
  const saved = useRef(loadState()).current;
  const route = useRef(readHash()).current;
  /* people carry project assignments that a claim can change, so rehydrate them
     before anything reads PEOPLE */
  if (saved && saved.peopleProjects) {
    Object.entries(saved.peopleProjects).forEach(([k, v]) => { const x = byKey(k); if (x) x.projects = v; });
  }

  const [projects, setProjects] = useState(saved ? saved.projects : SEED);
  const [shelf, setShelf] = useState(saved ? saved.shelf : SHELF_SEED);
  const [me, setMeRaw] = useState(byKey((route && route.who) || (saved && saved.meKey) || 'okonkwo') || byKey('okonkwo'));
  const [view, setView] = useState((route && route.view) || (saved && saved.view) || 'register');
  const [activeId, setActiveId] = useState(route && route.id ? route.id : null);
  const [shelfId, setShelfId] = useState(route && route.id ? route.id : null);
  const [onboardId, setOnboardId] = useState(null);
  const [recordOf, setRecordOf] = useState(route && route.view === 'record' ? route.id : null);
  const [nudged, setNudged] = useState(saved ? saved.nudged : []);
  const [checked, setChecked] = useState(saved ? saved.checked : []);
  const [briefsMade, setBriefsMade] = useState(saved ? saved.briefsMade : []);
  const [shared, setShared] = useState(saved ? saved.shared : ['amara']);
  const [profiles, setProfiles] = useState(saved && saved.profiles ? saved.profiles : {});
  const [paletteOpen, setPaletteOpen] = useState(false);
  /* first-time visitors get the orientation; a deep link never interrupts */
  const [orient, setOrient] = useState(!saved && !route);
  const [tour, setTour] = useState(null);

  const lens = lensOf(me);
  const scoped = projects.filter(p => lens !== 'sup' ? true : (me.scope === 'all' || (me.projects||[]).includes(p.id)));
  const shelfScoped = lens === 'sup' && me.scope !== 'all'
    ? shelf.filter(s => (me.projects||[]).includes(s.parent) || s.shelvedBy === me.k)
    : shelf;

  useEffect(() => { window.scrollTo({ top:0, behavior:'smooth' }); }, [view, activeId, shelfId, me.k]);

  const routeId = view === 'project' ? activeId : view === 'shelfitem' ? shelfId : view === 'record' ? recordOf : null;
  useEffect(() => { writeHash({ who:me.k, view, id:routeId }); }, [me.k, view, routeId]);
  useEffect(() => {
    const peopleProjects = {};
    PEOPLE.forEach(x => { if (x.projects) peopleProjects[x.k] = x.projects; });
    saveState({ projects, shelf, nudged, checked, briefsMade, shared, profiles, meKey:me.k, view, peopleProjects });
  }, [projects, shelf, nudged, checked, briefsMade, shared, profiles, me.k, view]);

  /* a deep link pasted into an already-open tab must actually navigate */
  useEffect(() => {
    const onHash = () => {
      const r = readHash();
      if (!r) return;
      const person = byKey(r.who);
      if (person && person.k !== me.k) setMeRaw(person);
      if (r.view) setView(r.view);
      if (r.id) {
        if (r.view === 'project')   setActiveId(r.id);
        if (r.view === 'shelfitem') setShelfId(r.id);
        if (r.view === 'record')    setRecordOf(r.id);
      }
    };
    window.addEventListener('hashchange', onHash);
    return () => window.removeEventListener('hashchange', onHash);
  }, [me.k]);

  useEffect(() => {
    const onKey = e => {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); setPaletteOpen(o => !o); }
      if (e.key === '/' && !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)) { e.preventDefault(); setPaletteOpen(true); }
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, []);

  /* switching lens keeps your place wherever the page still makes sense */
  function setMe(x){
    const to = lensOf(x);
    setMeRaw(x);
    setView(v => {
      /* The partner lens may only ever hold views that are redaction-aware.
         Carrying an internal project log across the lens switch would leak it. */
      if (to === 'partner') return ['shelfitem','record'].includes(v) ? v : HOME.partner;
      const keep = ['project','onboard','shelfitem','record'];
      return keep.includes(v) ? v : HOME[to];
    });
  }
  function goTour(i){
    if (i === null || i === undefined) { setTour(null); return; }
    const t = TOUR[i];
    setTour(i);
    const person = byKey(t.who);
    if (person) setMeRaw(person);
    setView(t.view);
  }
  const open = id => { setActiveId(id); setView('project'); };
  const openItem = id => { setShelfId(id); setView('shelfitem'); };
  const openRecord = k => { setRecordOf(k); setView('record'); };
  const goOnboard = id => { setOnboardId(id); setView('onboard'); };
  const nudge = k => setNudged(n => n.includes(k) ? n : [...n, k]);
  const toggleCheck = id => setChecked(c => c.includes(id) ? c.filter(x => x!==id) : [...c, id]);
  const onMade = pid => setBriefsMade(b => b.includes(pid) ? b : [...b, pid]);
  const toggleShare = k => setShared(a => a.includes(k) ? a.filter(x => x!==k) : [...a, k]);
  const myProfile = { ...BLANK_PROFILE, ...(profiles[me.k] || {}) };
  const setMyProfile = v => setProfiles(o => ({ ...o, [me.k]: v }));

  function addEntry(pid, e, author){
    setProjects(ps => ps.map(p => p.id !== pid ? p : ({ ...p, log:[...p.log, {
      ...e, id:'n' + Math.random().toString(36).slice(2,7), d:'2026-08-25', au:author.s,
      ack: (e.t==='decision' || e.t==='deadend') ? false : undefined,
    }] })));
  }
  function ack(pid, eid){
    setProjects(ps => ps.map(p => p.id !== pid ? p : ({ ...p, log:p.log.map(e => e.id === eid ? { ...e, ack:true } : e) })));
  }

  /* ── extraction → shelf ── */
  function publish(f, author){
    const home = projects.find(p => (author.projects||[]).includes(p.id)) || projects[0];
    const clean = a => a.filter(x => (x.h || x.n || '').trim());
    const s = {
      id:'x' + Math.random().toString(36).slice(2,6),
      code:'URI-S-2026-0' + (shelf.length + 5),
      parent:home.id, name:f.name.trim(), oneLine:f.oneLine.trim(),
      field:home.field, dept:home.dept, pi:home.pi,
      shelvedBy:author.k, shelvedOn:'2026-08-25',
      reason:f.reason, reasonText:f.reasonText.trim(),
      mode:f.mode, weeks:f.weeks, level:f.level, visibility:f.visibility,
      built:clean(f.built), deadends:clean(f.deadends), decisions:clean(f.decisions),
      remaining:clean(f.remaining), materials:clean(f.materials),
      skills:f.skills.split(',').map(x => x.trim()).filter(Boolean),
      learn:f.learn.split(',').map(x => x.trim()).filter(Boolean),
      shelfLife:{ date:f.shelfDate, why:f.shelfWhy.trim() },
      claimedBy:null,
    };
    setShelf(sh => [s, ...sh]);
  }

  /* ── shelf → bench: the extraction record becomes the opening continuity log ── */
  function claim(sid){
    const s = shelf.find(x => x.id === sid);
    if (!s) return;
    const owner = byKey(s.shelvedBy);
    const npid = 'r_' + s.id;
    let n = 0;
    const mk = (t, o) => ({ id:s.id + '_' + (n++), d:s.shelvedOn, t, au:owner.s, ...o,
                            ack:(t==='decision' || t==='deadend') ? true : undefined });
    const log = [
      ...s.built.map(x => mk('result', { h:x.h, b:x.b })),
      ...s.deadends.map(x => mk('deadend', { h:x.h, b:x.b, why:x.why, sev:'med' })),
      ...s.decisions.map(x => mk('decision', { h:x.h, b:x.b, why:x.why })),
      ...s.remaining.map(x => mk('next', { h:x.h, b:x.b })),
      { id:s.id + '_rev', d:'2026-08-25', t:'method', au:me.s,
        h:'Revived from the shelf',
        b:'Claimed off the shelf today. Everything above this line was written by ' + owner.n +
          ' at the point the project was shelved on ' + fmt(s.shelvedOn) + ' — ' + s.built.length + ' things that work, ' +
          s.deadends.length + ' recorded dead end' + (s.deadends.length===1?'':'s') + ', and ' + s.remaining.length +
          ' open threads. This project does not start from a blank page.' },
    ];
    const np = {
      id:npid, code:s.code.replace('URI-S-','URI-'), name:s.name, field:s.field,
      pi:s.pi, piEmail:'', dept:s.dept, started:s.shelvedOn, status:'active',
      oneLine:s.oneLine, revivedFrom:s.id,
      current:[{ n:me.n, i:me.i, r:me.line, tenure:'just started' }],
      incoming:null, alumni:owner.tier === 'alum' ? [{ n:owner.n, i:owner.i, r:owner.line }] : [],
      contacts:[
        { n:owner.n, r:owner.tier === 'alum' ? 'Original owner — graduated, reachable by email' : 'Original owner and mentor', c:'—' },
        { n:s.pi, r:'Principal investigator', c:'—' },
      ],
      artifacts:s.materials.map(m => ({ n:m.n, d:m.where + ' — ' + m.note })),
      reading:s.learn.map(x => ({ n:x, d:'Technique you pick up on this project.' })),
      log,
    };
    setProjects(ps => [...ps, np]);
    setShelf(sh => sh.map(x => x.id === sid ? { ...x, claimedBy:me.k } : x));
    const person = byKey(me.k);
    person.projects = [...(person.projects || []), npid];
    setMeRaw({ ...person });
    setActiveId(npid); setView('project');
  }

  function runAction(a){
    if (a.t === 'view')    setView(a.v);
    if (a.t === 'me')      setMe(byKey(a.k));
    if (a.t === 'project') open(a.k);
    if (a.t === 'shelf')   openItem(a.k);
    if (a.t === 'record')  openRecord(a.k);
    if (a.t === 'tour')    goTour(0);
    if (a.t === 'orient')  setOrient(true);
    if (a.t === 'reset')   { clearState(); location.hash = ''; location.reload(); }
  }
  const index = buildIndex({ projects, shelf, me, lens });

  const active = projects.find(p => p.id === activeId);
  const item = shelf.find(s => s.id === shelfId);
  const allDebt = scoped.flatMap(p => debts(p));
  /* every figure in the ticker must describe the SAME scope the reader can open,
     or a mentor sees an entry count from projects they cannot reach */
  const openShelf = shelfScoped.filter(s => !s.claimedBy);
  const scopedEntries = scoped.reduce((a,p) => a + p.log.length, 0);
  const nextDep = PEOPLE
    .filter(x => x.tier === 'ug' && x.departs && daysUntil(x.departs) > 0
                 && scoped.some(pr => (x.projects||[]).includes(pr.id)))
    .sort((a,b) => d(a.departs) - d(b.departs))[0];
  const partnerListed = shelf.filter(s => s.visibility === 'partner' && !s.claimedBy).length;
  const ticker = lens === 'partner'
    ? [pl(partnerListed,'project','projects') + ' listed',
       shelf.filter(s => s.visibility !== 'partner').length + ' withheld',
       pl(shared.length,'researcher record','researcher records'),
       'introductions brokered']
    : [pl(scoped.length,'project','projects'),
       pl(scopedEntries,'entry','entries'),
       pl(openShelf.length,'project','projects') + ' on the shelf',
       nextDep ? 'next departure ' + daysUntil(nextDep.departs) + 'd' : 'no departures queued'];

  return (
    <NavCtx.Provider value={{ openRecord, open, openItem }}>
    <div className="min-h-screen">
      <a href="#main" className="skip">Skip to content</a>
      <Masthead me={me} setMe={setMe} view={view} setView={setView} ticker={ticker} openPalette={() => setPaletteOpen(true)} />
      <Palette open={paletteOpen} setOpen={setPaletteOpen} index={index} run={runAction} />
      {orient && <Orientation onTour={() => { setOrient(false); goTour(0); }} onClose={() => setOrient(false)} />}
      {tour !== null && <TourBar step={tour} setStep={goTour} onExit={() => setTour(null)} />}
      <main id="main">

      {view === 'register'  && <SupRegister projects={scoped} me={me} open={open} goOnboard={goOnboard} />}
      {view === 'risk'      && <RiskView projects={scoped} shelf={shelfScoped} me={me} open={open} ack={ack} nudge={nudge} nudged={nudged} />}
      {view === 'handoffs'  && <HandoffsView projects={scoped} me={me} goOnboard={goOnboard} open={open} briefsMade={briefsMade} />}
      {view === 'extract'   && <Extraction me={me} projects={projects} onPublish={publish} setView={setView} />}

      {view === 'shelf'     && <ShelfView shelf={shelfScoped} me={me} openItem={openItem} setView={setView} profile={myProfile} />}
      {view === 'shelfitem' && item && (
        <RevivalBrief s={item} me={me} back={() => setView(lens === 'partner' ? 'partnerShelf' : 'shelf')}
          onClaim={claim} redacted={lens === 'partner'} />
      )}

      {view === 'bench'     && <Bench projects={projects} me={me} open={open} addEntry={addEntry} setView={setView} nudged={nudged} />}
      {view === 'projects'  && (
        <div className="max-w-[1240px] mx-auto px-8 pb-32">
          <Plate variant="rule" eyebrow="Projects" ghost={scoped.length}
            title="Every project in the group, including the ones you are not on."
            lede="Undergraduates can read the whole register. Most of what you need to learn was written down by someone on a project that is not yours." />
          <PageIntro what="The same register your PI sees, with your own open threads called out instead of risk." />
          <Register projects={scoped} me={me} open={open} goOnboard={goOnboard} />
        </div>
      )}
      {view === 'myhandoff' && <MyHandoff projects={projects} me={me} open={open} goOnboard={goOnboard} checked={checked} toggleCheck={toggleCheck} briefsMade={briefsMade} onMade={onMade} />}
      {view === 'starthere' && <Onboarding projects={projects} me={me} auto openProject={open} onMade={onMade} />}
      {view === 'profile'   && (
        <ProfileView me={me} projects={projects} shelf={shelfScoped} profile={myProfile}
          setProfile={setMyProfile} openItem={openItem} open={open} setView={setView} />
      )}
      {view === 'record'    && (
        <RecordView projects={projects} shelf={shelf} me={me} who={recordOf ? byKey(recordOf) : null} openRecord={openRecord}
          shared={shared} toggleShare={toggleShare} open={lens === 'partner' ? null : open}
          partnerLens={lens === 'partner'} />
      )}

      {view === 'partnerShelf'  && <PartnerView shelf={shelf} projects={projects} me={me} shared={shared} openItem={openItem} openRecord={openRecord} />}
      {view === 'partnerTalent' && <PartnerView shelf={shelf} projects={projects} me={me} shared={shared} sub="talent" openItem={openItem} openRecord={openRecord} />}

      {view === 'project' && active && (
        <ProjectDetail p={active} me={me} back={() => { setActiveId(null); setView(lens==='ug' ? 'projects' : 'register'); }}
          goOnboard={goOnboard} addEntry={addEntry} ack={ack} open={open} />
      )}
      {view === 'onboard' && <Onboarding projects={projects} initial={onboardId} me={me} openProject={open} onMade={onMade} />}
      </main>

      <footer className="border-t hair mt-20" style={tour !== null ? { paddingBottom:150 } : undefined}>
        <div className="max-w-[1240px] mx-auto px-8 py-10 flex items-end justify-between gap-6 flex-wrap">
          <div>
            <div className="font-display text-[19px] tracking-mega">URI</div>
            <p className="font-display italic text-[13px] text-faint mt-1 max-w-[46ch] leading-relaxed">
              A shared research record for project handoffs, used by outgoing and incoming students.
            </p>
          </div>
          <div className="flex items-center gap-4 flex-wrap">
            <button onClick={() => setOrient(true)}
              className="font-mono text-[10px] uppercase tracking-wider2 text-faint hover:text-ink transition-colors">What this is</button>
            <button onClick={() => goTour(0)}
              className="font-mono text-[10px] uppercase tracking-wider2 text-faint hover:text-ink transition-colors">Walkthrough</button>
            <button onClick={() => setPaletteOpen(true)}
              className="font-mono text-[10px] uppercase tracking-wider2 text-faint hover:text-ink transition-colors">Search ⌘K</button>
            <button onClick={() => runAction({ t:'reset' })}
              className="font-mono text-[10px] uppercase tracking-wider2 text-faint hover:text-oxblood transition-colors">Reset demo</button>
            <span className="font-mono text-[10px] uppercase tracking-wider2 text-faint">Prototype · mock data · Fall 2026</span>
          </div>
        </div>
      </footer>
    </div>
    </NavCtx.Provider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
